# Default values for logiq-flash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
replicaCountMl: 2
replicaCountSync: 2

sync:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountSync=2
  pdb:
    enabled: true
    minAvailable: 1
  # Extra flags for the flash-sync container only. The sync node gets no
  # global.environment.extraflag / rate_limit_flags.
  extraArgs: ""

# Zone-only spread — hard podAntiAffinity (podPerNode) already covers hostname.
# preStop is 30s (vs 15s elsewhere) — flash has more persistent TCP connections.
# terminationGracePeriodSeconds stays at 120s (set in template, not here).
flash:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # zone only; hostname covered by hard anti-affinity
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  preStopSleepSeconds: 30
  workersPerCPU: 150
  # N-1 for replicaCount=2
  pdb:
    enabled: true
    minAvailable: 1
  # OrderedReady (Kubernetes default) or Parallel. Parallel starts and stops all
  # pods at once, which large fleets need to scale in reasonable time.
  # IMMUTABLE on a live StatefulSet: to change it, run
  #   kubectl -n <ns> delete sts logiq-flash --cascade=orphan
  # and then sync/upgrade. Pods and PVCs are kept and adopted by the new sts.
  podManagementPolicy: OrderedReady
  # Extra flags for the logiq-flash ingest container only, appended after
  # global.environment.extraflag and rate_limit_flags (a repeated flag takes the
  # last value). Use this for ingest-only flags such as -max_bytes_per_sec.
  extraArgs: ""
  query:
    # Extra flags for the logiq-flash-query sidecar only, appended last.
    extraArgs: ""

ml:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  # Preferred anti-affinity: additive alongside the hard podPerNode rule, never blocks.
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountMl=2
  pdb:
    enabled: true
    minAvailable: 1
  # Extra flags for the logiq-flash-ml container only, appended last.
  extraArgs: ""

image:
  repository: logiqai/flash
  tag: 1.2.0
  pullPolicy: IfNotPresent

sidecarTracing:
       image: logiqai/tracing
       tag: v1.35.2-lq1-c
       imagePullPolicy: Always

sidecarTracingMl:
       image: logiqai/tracing
       tag: v1.35.2-lq1-q
       imagePullPolicy: Always
        

metrics:
  serviceMonitor:
    enabled: false
    # Labels added to every flash ServiceMonitor; also what Prometheus selects on.
    selector:
      release: prometheus
    # Extra labels for every flash ServiceMonitor (wins over selector on a duplicate key).
    labels: {}
    # Scrape settings applied to every endpoint of the flash, flash-ml and
    # flash-sync ServiceMonitors. scrapeTimeout must not exceed interval.
    interval: 2m
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
    # Additional ServiceMonitors, rendered when enabled is true. Each entry:
    #   - name: flash-fast-scrape        # required
    #     labels: {}                     # optional
    #     spec: {...}                    # required, full ServiceMonitor spec
    extraServiceMonitors: []

