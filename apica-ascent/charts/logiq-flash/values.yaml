# Default values for logiq-flash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
replicaCountMl: 2
replicaCountSync: 2

sync:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxSurge: 2
    maxUnavailable: 0
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountSync=2
  pdb:
    enabled: true
    minAvailable: 1

# Zone-only spread — hard podAntiAffinity (podPerNode) already covers hostname.
# preStop is 30s (vs 15s elsewhere) — flash has more persistent TCP connections.
# terminationGracePeriodSeconds stays at 120s (set in template, not here).
flash:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # zone only; hostname covered by hard anti-affinity
  updateStrategy:
    type: RollingUpdate
    maxSurge: 2
    maxUnavailable: 0
  preStopSleepSeconds: 30
  # N-1 for replicaCount=2
  pdb:
    enabled: true
    minAvailable: 1

ml:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  # Preferred anti-affinity: additive alongside the hard podPerNode rule, never blocks.
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxSurge: 2
    maxUnavailable: 0
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountMl=2
  pdb:
    enabled: true
    minAvailable: 1

image:
  repository: logiqai/flash
  tag: 1.2.0
  pullPolicy: IfNotPresent

sidecarTracing:
       image: logiqai/tracing
       tag: v1.35.2-lq1-c
       imagePullPolicy: Always

sidecarTracingMl:
       image: logiqai/tracing
       tag: v1.35.2-lq1-q
       imagePullPolicy: Always
        

metrics:
