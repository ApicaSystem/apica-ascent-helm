# Default values for logiq-flash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
replicaCountMl: 2
replicaCountSync: 2

sync:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountSync=2
  pdb:
    enabled: true
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetMemoryUtilizationPercentage: 75
    targetCPUUtilizationPercentage: 65
    scaleDown:
      stabilizationWindowSeconds: 300
      podsValue: 1
      podsPeriodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      podsValue: 2
      podsPeriodSeconds: 60

# Zone-only spread — hard podAntiAffinity (podPerNode) already covers hostname.
flash:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # zone only; hostname covered by hard anti-affinity
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  # N-1 for replicaCount=2
  pdb:
    enabled: true
    minAvailable: 1

  # Graceful shutdown via PreStop flush before SIGTERM.
  # Budget: flushCurlTimeoutSeconds(900) + status-poll-max(60) + SIGTERM-buffer(60) + overhead(30) = 1050
  flushCurlTimeoutSeconds: 900
  flushAppTimeoutSeconds: 600
  terminationGracePeriodSeconds: 1050

  # KEDA autoscaling for flash — scales on Envoy ingestion throughput.
  # Requires: KEDA + kube-state-metrics in cluster. PodMonitor auto-enables when keda.enabled=true.
  #
  # Four triggers (keda-flash.yaml), KEDA picks the highest desired across all:
  #   1. Envoy bytes/sec    — primary signal; 1 pod per 1 GB/hr (298261 bytes/sec).
  #   2. Termination-aware  — desired = ceil(bytes/threshold) + count(terminating pods).
  #                           K8s counts Terminating pods in currentReplicas for external metrics,
  #                           so trigger 1 stalls during scale-down (desired==current, no new pods).
  #                           Trigger 2 breaks the stall: desired exceeds current → HPA acts.
  #                           Uses kube_pod_deletion_timestamp from kube-state-metrics.
  #   3. Memory (75%)       — fallback; resource triggers already exclude Terminating pods (K8s 1.20+).
  #   4. CPU (75%)          — same fallback for compute spikes.
  #
  # threshold: 1 GB/hr per pod = 1073741824 / 3600 = 298261 bytes/sec.
  # scaleDown.stabilizationWindowSeconds=300: waits 5 min of sustained low load before scaling down.
  # scaleDown.periodSeconds=150: removes at most 1 pod per 2.5 min; trigger 2 creates replacements
  #   immediately if load returns while old pods are still terminating (terminationGracePeriod=1050s).
  keda:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    threshold: "298261"
    fallbackReplicas: 2
    targetMemoryUtilizationPercentage: 75
    targetCPUUtilizationPercentage: 75
    scaleDown:
      stabilizationWindowSeconds: 300
      podsValue: 1
      podsPeriodSeconds: 150
    scaleUp:
      stabilizationWindowSeconds: 0
      podsValue: 4
      podsPeriodSeconds: 60
    # kube-state-metrics service location for the termination-aware trigger ServiceMonitor.
    # Override in root values.yaml under logiq-flash.flash.keda.kubeStateMetrics if your
    # kube-state-metrics is in a different namespace or has different labels/port.
    kubeStateMetrics:
      namespace: monitoring
      serviceSelectorLabel: kube-state-metrics   # value of app.kubernetes.io/name on the service
      port: http                                  # named port on the kube-state-metrics service

ml:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  # Preferred anti-affinity: additive alongside the hard podPerNode rule, never blocks.
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountMl=2
  pdb:
    enabled: true
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetMemoryUtilizationPercentage: 75
    targetCPUUtilizationPercentage: 65
    scaleDown:
      stabilizationWindowSeconds: 300
      podsValue: 1
      podsPeriodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      podsValue: 2
      podsPeriodSeconds: 60

image:
  repository: logiqai/flash
  tag: 1.2.0
  pullPolicy: IfNotPresent

sidecarTracing:
       image: logiqai/tracing
       tag: v1.35.2-lq1-c
       imagePullPolicy: Always

sidecarTracingMl:
       image: logiqai/tracing
       tag: v1.35.2-lq1-q
       imagePullPolicy: Always
        

metrics:
  serviceMonitor:
    enabled: false
    selector:
      release: prometheus

  # PodMonitor that scrapes Envoy proxy pods on port 19001 (/stats/prometheus).
  # Required for flash.keda to have data. Prometheus picks this up automatically
  # (podMonitorSelector: {} in the Prometheus CR).
  envoyPodMonitor:
    enabled: false
    interval: 15s

secrets_name:
pullSecretName: 

discoveryService:
  name: flash-discovery

service:
  type: NodePort


tracingui:
  port: 16686
  name: tracingui

tracinggrpc:
    port: 14250
    name: tracinggrpc

tracingapi:
    port: 14268
    name: tracingapi

rawtcp:
   port: 517
   name: rawtcp
   containerPort: 1517

