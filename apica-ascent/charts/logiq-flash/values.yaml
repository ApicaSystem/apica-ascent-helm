# Default values for logiq-flash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2
replicaCountMl: 2
replicaCountSync: 2

sync:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountSync=2
  pdb:
    enabled: true
    minAvailable: 1

# Zone-only spread — hard podAntiAffinity (podPerNode) already covers hostname.
flash:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # zone only; hostname covered by hard anti-affinity
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  workersPerCPU: 150
  # N-1 for replicaCount=2
  pdb:
    enabled: true
    minAvailable: 1

  # Graceful shutdown via PreStop flush before SIGTERM.
  # Budget: flushCurlTimeoutSeconds(900) + status-poll-max(60) + SIGTERM-buffer(60) + overhead(30) = 1050
  flushCurlTimeoutSeconds: 900
  flushAppTimeoutSeconds: 600
  terminationGracePeriodSeconds: 1050

  # KEDA autoscaling for flash; requires KEDA in-cluster. Query documented in keda-flash.yaml.
  # The HPA owns spec.replicas once enabled — Argo must ignore /spec/replicas or every sync
  # resets the count (see statefulSet.yaml).
  keda:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    # Bytes/sec per pod: 596523 = 2 GB/hr, 20% below flash's own per-pod cap
    # (max_bytes_per_sec in global.environment.rate_limit_flags) so pods scale before hitting
    # their limit. Must stay <= that cap, or scale-up can stall under sustained load.
    threshold: "596523"
    fallbackReplicas: 2
    # currentReplicasIfHigher: never scales down during an outage, only up to fallbackReplicas.
    fallbackBehavior: currentReplicasIfHigher
    # Must span >= 2 Envoy scrapes (metrics.envoyPodMonitor.interval) or rate() returns no data.
    rateWindow: 2m
    # Inert while minReplicas > 0 (KEDA warns it's irrelevant); kept for if scale-to-zero is
    # ever used.
    pollingInterval: 15
    failureThreshold: 3            # consecutive failures before falling back to fallbackReplicas
    # Disabled in keda-flash.yaml — PerfectScale owns resource sizing. Kept here for reference.
    # targetMemoryUtilizationPercentage: 90
    # targetCPUUtilizationPercentage: 90
    # Empty string auto-derives: http://prometheus-operated.<release-namespace>.svc:9090
    # Override if Prometheus is in a different namespace or uses a non-operator setup.
    prometheusAddress: ""
    scaleDown:
      stabilizationWindowSeconds: 300
      podsValue: 1
      podsPeriodSeconds: 150
    scaleUp:
      stabilizationWindowSeconds: 0
      podsValue: 4
      podsPeriodSeconds: 60

  # Caps keda.maxReplicas to this environment's license entitlement ("Number of flash pods"),
  # via a CronJob (see cronjob-license-sync.yaml) — KEDA has no way to drive maxReplicaCount
  # from a metric, so an external periodic patch is the only way to move it.
  licenseSync:
    # Also sizes the OCI Flexible LB's flex-max bandwidth annotation on the EnvoyProxy CR —
    # only enable this on an OCI + Envoy Gateway deployment.
    enabled: false
    schedule: "*/10 * * * *"
    image:
      # Fully-qualified — this cluster rejects an unqualified "alpine/k8s" as ambiguous.
      repository: docker.io/alpine/k8s
      tag: "1.36.5"
    fetchDataUrl: "https://harness-supporting-scripts.s3.amazonaws.com/fetch_data"
    # SHA-256 pin so a run fails closed if this binary ever changes unexpectedly.
    fetchDataSha256: "0082400884d1cff53b9b9771dfa5ce90fcebd580dd39fe661f4893bb49311bf4"
    # Covers both the entitlement sync and LB bandwidth sync phases, sequential in one pod.
    activeDeadlineSeconds: 120
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5

ml:
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway   # soft — never blocks scheduling
  # Preferred anti-affinity: additive alongside the hard podPerNode rule, never blocks.
  podAntiAffinity:
    enabled: true
    weight: 100
  updateStrategy:
    type: RollingUpdate
    maxUnavailable: 1
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15
  # N-1 for replicaCountMl=2
  pdb:
    enabled: true
    minAvailable: 1

image:
  repository: logiqai/flash
  tag: 1.2.0
  pullPolicy: IfNotPresent

sidecarTracing:
       image: logiqai/tracing
       tag: v1.35.2-lq1-c
       imagePullPolicy: Always

sidecarTracingMl:
       image: logiqai/tracing
       tag: v1.35.2-lq1-q
       imagePullPolicy: Always
        

metrics:
  serviceMonitor:
    enabled: false
    selector:
      release: prometheus

  # PodMonitor that scrapes Envoy proxy pods on port 19001 (/stats/prometheus).
  # Required for flash.keda to have data. Prometheus picks this up automatically
  # (podMonitorSelector: {} in the Prometheus CR).
  envoyPodMonitor:
    enabled: false
    interval: 15s

secrets_name:
pullSecretName: 

discoveryService:
  name: flash-discovery

service:
  type: NodePort


tracingui:
  port: 16686
  name: tracingui

tracinggrpc:
    port: 14250
    name: tracinggrpc

tracingapi:
    port: 14268
    name: tracingapi

rawtcp:
   port: 517
   name: rawtcp
   containerPort: 1517

