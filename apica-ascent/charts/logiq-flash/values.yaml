# Splunk S2S listener (Universal and Heavy Forwarders). TLS on 9997 with the
# Flash server certificate, plain TCP on 9996 for lab use. Always exposed on the
# flash container and Services; Flash versions without S2S just refuse
# connections on these ports.
s2stls:
  port: 9997
  name: s2stls

s2s:
  port: 9996
  name: s2s

raftHttp:
  port: 4001
  name: raft-http

raft:
  port: 4002
  name: raft

## Persist data to a persistent volume
persistence:
  enabled: true
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  ## gp2 - aws
  #storageClassName: gp2
  ## do-block-storage - digitalocean
  #storageClassName: do-block-storage
  ## standard - minikube
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: "10Gi"
  ml_size: "10Gi"


configurationFiles: true
configMapName:
podPerNode: false
existingSecret:

logflow_only:
  enabled: false
  args: ""

resources: 
   sidecarTracing: {}

   sidecarTracingMl: {}   

   sidecar: {}



  # requests:
  #  memory: "3Gi"
  #  cpu: "1000m"
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

global:
  sharedSecretName: logiq-shared-secret
  cloudProvider: aws

  # NodePort Configuration
  nodePort:
    enabled: false
    ports:
      flash: null
      flashMl: null

  nodeSelectors:
    enabled: false
    label: apica-node-pool
    ingest: ingest
    infra: base
    other: base
    db: common
    cache: common
    ingest_sync: base

  taints:
    enabled: false
    ingest: flash
    infra: infra
    other: coffee
    db: db
    cache: cache
    ingest_sync: sync

  toolbox:
    image:
      repository: logiqai/toolbox
      tag: 2.0.1

  chart:
    s3gateway: false
    prometheus: true
    postgres: true
    redis: true
    grafana: false

  environment:
    redis_opts: true
    redis_host: "redis-master"
    redis_port: "6379"
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    s3_url: "http://s3-gateway:9000"
    s3_access: "logiq_access"
    s3_secret: "logiq_secret"
    s3_bucket: "logiq-bucket"
    s3_region: "us-east-1"
    s3_custom_ca:
      enabled: false
      map_name: "kube-root-ca.crt"
    s3_credentials_secret:
      name: ""
      access_key_name: access_key
      secret_key_name: secret_key
      bucket_key_name: bucket
      session_token_name: ""
      mount_path: /flash/s3creds
    AWS_ACCESS_KEY_ID: "AWS_ACCESS"
    AWS_SECRET_ACCESS_KEY: "AWS_SECRET"
    awsServiceEndpoint: "https://s3.amazonaws.com"
    extraflag: ""
    rate_limit_flags: ""
    postgres_tls:
      enabled: false
      sslmode: "verify-full"
      mtls: false     # set true to add POSTGRES_SSLCERT/KEY (requires pg-client.crt/pg-client.key in tls.certSecretName secret)
    redis_tls:
      enabled: false
      skip_verify: false  # REDIS_TLS_SKIP_VERIFY; encrypts without server auth — logs a warning

  persistence:
    createStorageClass:
      enabled: false
    storageClass: oci-bv
kafka_client:
  enabled: false
  kafka_args: ""

tls:
  # Secret mounted into flash pods at /flash/tls-certs.
  # Must be set whenever any cert path below is configured.
  certSecretName: ""
  postgres:
    caCert: ""                                   # e.g. /flash/tls-certs/pg-ca.crt; omit for publicly-signed certs
    clientCert: "/flash/tls-certs/pg-client.crt"   # mTLS client cert
    clientKey: "/flash/tls-certs/pg-client.key"    # mTLS client key
  redis:
    caCert: ""        # e.g. /flash/tls-certs/redis-ca.crt; omit for publicly-signed certs
