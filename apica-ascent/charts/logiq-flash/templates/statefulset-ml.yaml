apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "logiq-flash.name" . }}-ml
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiq-flash.name" . }}-ml
    chart: {{ template "logiq-flash.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  serviceName: {{ template "logiq-flash.name" . }}-ml
  replicas: {{ .Values.replicaCountMl }}
  selector:
    matchLabels:
      app: {{ template "logiq-flash.name" . }}-ml
      release: {{ .Release.Name }}
  # Rolling update: 1 pod down at a time; readinessProbe gates traffic during rollout.
  updateStrategy:
    type: {{ .Values.ml.updateStrategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.ml.updateStrategy.maxUnavailable }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.ml_size | quote }}
        storageClassName: {{ .Values.global.persistence.storageClass }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum }}
      labels:
        app: {{ template "logiq-flash.name" . }}-ml
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: logiq-flash
      # preStop(15s) fills the LB-drain gap before SIGTERM; 60s is the hard ceiling.
      terminationGracePeriodSeconds: {{ .Values.ml.terminationGracePeriodSeconds }}

      # Zone-only spread — ScheduleAnyway never blocks scheduling.
      {{- if .Values.ml.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.ml.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.ml.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ template "logiq-flash.name" . }}-ml
              release: {{ .Release.Name }}
        - maxSkew: {{ .Values.ml.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.ml.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ template "logiq-flash.name" . }}-ml
              release: {{ .Release.Name }}
      {{- end }}

      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      affinity:
        {{- if .Values.global.nodeSelectors.enabled }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.global.nodeSelectors.label }}
                    operator: In
                    values:
                      - {{ .Values.global.nodeSelectors.other }}
        {{- end }}
        # Preferred anti-affinity: adds scheduling pressure without ever blocking.
        {{- if .Values.ml.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.ml.podAntiAffinity.weight }}
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ template "logiq-flash.name" . }}-ml
                    release: {{ .Release.Name }}
        {{- end }}

      {{- if .Values.global.taints.enabled }}
      tolerations:
        - key: dedicated
          operator: Equal
          value: {{ .Values.global.taints.other }}
          effect: NoSchedule
      {{- end }}

      initContainers:
        - name: check-redis
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until redis-cli -h {{ .Values.global.environment.redis_host }} ping;
              do echo "waiting for {{ .Values.global.environment.redis_host }}"; sleep 1; done;

        {{- if .Values.global.chart.s3gateway }}
        - name: check-s3-gateway
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until $(curl --output /dev/null --silent --fail http://s3-gateway:9000/minio/health/ready);
              do echo "waiting for s3-gateway"; sleep 1; done;
        {{- end }}

        - name: check-flash
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until $(curl --output /dev/null --silent --fail http://logiq-flash:8080/ready);
              do echo "waiting for flash"; sleep 1; done;

      volumes:
        {{- if .Values.configurationFiles }}
        - name: config
          configMap:
            {{- if not .Values.configMapName }}
            name: logiq-config
            {{- else }}
            name: {{ .Values.configMapName }}
            {{- end }}
        {{- end }}
        {{- if .Values.secrets_name }}
        - name: certs
          secret:
            secretName: {{ .Values.secrets_name }}
        {{- end }}
        {{- if .Values.global.sharedSecretName }}
        - name: sharedcert
          secret:
            secretName: {{ .Values.global.sharedSecretName }}
        {{- end }}
        - name: casdoor-conf
          secret:
            secretName: casdoor-conf

      containers:
        - name: {{ .Chart.Name }}-ml
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
          args:
            - -c
            - /flash/bin/flash -config /flash/config/config.yaml -install_root /flash -runtime_folder /flash/db -is-kube=true -discovery_domain=$(DISCOVERY_DOMAIN) -pg_max_idle_conns 3 -pg_max_open_Conns 5 -metadata-db-ttl 11m -postgres_timeout 20s -api-node  -redis_max_connections 3000 --pg_conn_max_lifetime 5m -ml-use-sidecar {{ .Values.global.environment.extraflag }} {{- if eq (toString .Values.logflow_only.enabled) "true" }} {{ .Values.logflow_only.args }} {{- else }} {{ .Values.global.environment.rate_limit_flags }} {{- end }}
          # Sleep before SIGTERM so the LB stops routing before the process exits.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.ml.preStopSleepSeconds }}"]
          env:
            - name: host
              value: {{ .Values.global.domain }}
            - name: CONFIG_HASH
              value: {{ include "logiq-flash.confighash" . | quote }}
            - name: DISCOVERY_DOMAIN
              value: {{ template "logiq-flash.name" . }}-ml
            {{- if .Values.global.environment.parent_host }}
            - name: PARENT_HOST
              value: {{ .Values.global.environment.parent_host }}
            {{- end }}
            {{- if .Values.global.environment.redis_opts }}
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_port
            {{- end }}
            {{- if .Values.global.environment.admin_email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_email
            {{- end }}
            {{- if .Values.global.environment.admin_password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_password
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_db
            {{- if .Values.global.sharedSecretName }}
            - name: S3_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_access
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_secret
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_bucket
            {{- end }}
            {{- if .Values.global.environment.cluster_id }}
            - name: MY_CLUSTER_ID
              value: {{ .Values.global.environment.cluster_id }}
            {{- end }}
            - name: MY_APP_NAME
              value: {{ template "logiq-flash.name" . }}-ml
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: dataSourceName
              valueFrom:
                secretKeyRef:
                  name: casdoor-conf
                  key: dataSourceName

          volumeMounts:
            - mountPath: /flash/config
              name: config
            - mountPath: /flash/db
              name: data
            {{- if .Values.secrets_name }}
            - mountPath: /flash/certs
              name: certs
            {{- end }}
            {{- if .Values.global.sharedSecretName }}
            - mountPath: /flash/sharedcerts
              name: sharedcert
            {{- end }}
            - mountPath: /flash/conf/casdoor.conf
              name: casdoor-conf
              subPath: casdoor.conf

          ports:
            - name: grpc
              containerPort: 50054
              protocol: TCP
            - name: webcli
              containerPort: 9998
              protocol: TCP
            - name: api
              containerPort: 9999
              protocol: TCP
            - name: healthcheck
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 25
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources.ml | nindent 12 }}

        - name: {{ .Chart.Name }}-tracing
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.sidecarTracingMl.image }}:{{ .Values.sidecarTracingMl.tag }}"
          imagePullPolicy: {{ .Values.sidecarTracingMl.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              while true
              do
              /go/bin/query-linux --grpc-storage.server=localhost:50054 --query.bearer-token-propagation=true --query.base-path=/dtracing
              sleep 5
              done
          env:
            - name: SPAN_STORAGE_TYPE
              value: grpc-plugin
          ports:
            - containerPort: 16686
              name: tracing
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /dtracing
              port: 16686
            initialDelaySeconds: 25
            periodSeconds: 25
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 3

          # timeoutSeconds: 125 matches readiness — Jaeger query can be slow under load.
          livenessProbe:
            httpGet:
              path: /dtracing
              port: 16686
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources.sidecarMlTracing | nindent 12 }}