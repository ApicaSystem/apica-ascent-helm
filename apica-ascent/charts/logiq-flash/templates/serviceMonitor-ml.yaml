{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: {{ template "logiq-flash.name" . }}-ml
    {{- with (include "logiq-flash.serviceMonitorLabels" . | trim) }}
    {{- . | nindent 4 }}
    {{- end }}
  name: prometheus-{{ .Release.Namespace }}-{{ template "logiq-flash.name" . }}-ml
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - basicAuth:
      password:
        key: admin_password
        name: {{ template "logiq-flash.fullname" . }}
      username:
        key: admin_email
        name: {{ template "logiq-flash.fullname" . }}
    {{- include "logiq-flash.serviceMonitorEndpointSettings" . | nindent 4 }}
    path: /metrics
    scheme: https
    targetPort: 9998
    tlsConfig:
      insecureSkipVerify: true
  - basicAuth:
      password:
        key: admin_password
        name: {{ template "logiq-flash.fullname" . }}
      username:
        key: admin_email
        name: {{ template "logiq-flash.fullname" . }}
    {{- include "logiq-flash.serviceMonitorEndpointSettings" . | nindent 4 }}
    path: /metrics
    scheme: https
    targetPort: 8899
    tlsConfig:
      insecureSkipVerify: true
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      promMonitor: {{ template "logiq-flash.name" . }}-ml
{{- end }}
