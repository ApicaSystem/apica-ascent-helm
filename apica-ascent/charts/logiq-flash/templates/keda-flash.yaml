{{- if .Values.flash.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ template "logiq-flash.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiq-flash.name" . }}
    chart: {{ template "logiq-flash.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ template "logiq-flash.name" . }}
  pollingInterval: {{ .Values.flash.keda.pollingInterval }}
  minReplicaCount: {{ .Values.flash.keda.minReplicas }}
  maxReplicaCount: {{ .Values.flash.keda.maxReplicas }}
  fallback:
    failureThreshold: {{ .Values.flash.keda.failureThreshold }}
    replicas: {{ .Values.flash.keda.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.flash.keda.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.flash.keda.scaleDown.podsValue }}
              periodSeconds: {{ .Values.flash.keda.scaleDown.podsPeriodSeconds }}
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: {{ .Values.flash.keda.scaleUp.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.flash.keda.scaleUp.podsValue }}
              periodSeconds: {{ .Values.flash.keda.scaleUp.podsPeriodSeconds }}
          selectPolicy: Max
  triggers:
    # Trigger 1: primary scale signal — Envoy bytes/sec to flash pods.
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.flash.keda.prometheusAddress | default (printf "http://prometheus-operated.%s.svc:9090" .Release.Namespace) }}
        threshold: {{ .Values.flash.keda.threshold | quote }}
        query: |
          sum(rate(envoy_cluster_upstream_cx_tx_bytes_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/{{ .Release.Name }}-flash-http/rule/.*"}[2m]))
    # Trigger 2: termination-aware scale signal.
    # K8s counts Terminating pods in currentReplicas for external metrics, so trigger 1 stalls
    # when desired > running but desired ≤ running+terminating (HPA sees no need to scale up).
    # This trigger adds terminating pods to desired, but ONLY when desired_from_load > ready_replicas —
    # preventing unnecessary pod recreation during normal scale-down where running pods already satisfy load.
    # Formula: ceil(bytes/threshold) + (desired > ready ? count(terminating) : 0)
    # Requires kube-state-metrics: kube_pod_deletion_timestamp + kube_statefulset_status_replicas_ready.
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.flash.keda.prometheusAddress | default (printf "http://prometheus-operated.%s.svc:9090" .Release.Namespace) }}
        threshold: "1"
        metricType: Value
        query: |
          clamp_min(
            ceil((sum(rate(envoy_cluster_upstream_cx_tx_bytes_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/{{ .Release.Name }}-flash-http/rule/.*"}[2m])) or vector(0)) / {{ .Values.flash.keda.threshold }})
            + (
                (ceil((sum(rate(envoy_cluster_upstream_cx_tx_bytes_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/{{ .Release.Name }}-flash-http/rule/.*"}[2m])) or vector(0)) / {{ .Values.flash.keda.threshold }})
                  > bool scalar(kube_statefulset_status_replicas_ready{namespace="{{ .Release.Namespace }}", statefulset="{{ include "logiq-flash.name" . }}"}))
                * (count(kube_pod_deletion_timestamp{namespace="{{ .Release.Namespace }}", pod=~"{{ include "logiq-flash.name" . }}-[0-9]+"}) or vector(0))
            )
          , {{ .Values.flash.keda.minReplicas }})
    # Trigger 3: memory pressure — resource triggers exclude Terminating pods (K8s 1.20+).
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .Values.flash.keda.targetMemoryUtilizationPercentage | quote }}
    # Trigger 4: CPU spikes independent of ingestion throughput.
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.flash.keda.targetCPUUtilizationPercentage | quote }}
{{- end }}
