apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "logiq-flash.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiq-flash.name" . }}
    chart: {{ template "logiq-flash.chart" . }}
    heritage: {{ .Release.Service }}
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
rules:
# Monitoring resources (namespace-scoped)
- apiGroups:
  - monitoring.coreos.com
  resources:
  - alertmanagers
  - alertmanagers/finalizers
  - prometheuses
  - prometheuses/finalizers
  - thanosrulers
  - thanosrulers/finalizers
  - servicemonitors
  - podmonitors
  - prometheusrules
  verbs:
  - '*'

# Core namespace-scoped resources
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - '*'

- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - watch
  - create
  - delete
  - update
  - patch
  - list

- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update

# Application workloads (namespace-scoped)
- apiGroups:
  - apps
  resources:
  - statefulsets
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
  - update

# Pod security policy permissions
- apiGroups:
  - policy
  resourceNames:
  - logiq-flash
  resources:
  - podsecuritypolicies
  verbs:
  - use
- apiGroups:
  - extensions
  resourceNames:
  - logiq-flash
  resources:
  - podsecuritypolicies
  verbs:
  - use

# Gateway API resources (namespace-scoped)
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - tcproutes
  - udproutes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete