apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "logiq-flash.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiq-flash.name" . }}
    chart: {{ template "logiq-flash.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  serviceName: {{ template "logiq-flash.name" . }}-headless
  # Seeds the initial count only. Once flash.keda.enabled=true the HPA owns spec.replicas, so
  # the Argo Application must ignore /spec/replicas here (ignoreDifferences plus
  # RespectIgnoreDifferences=true — the latter is required, or Argo still sends the field).
  # Otherwise every sync reapplies this value, bypassing the HPA scaleDown policy and deleting
  # all surplus pods at once, each starting its own 1050s S3 flush. Observed 2026-08-14: a sync
  # dropped 7 -> 2, killing 5 pods in one step despite a 1 pod / 150s policy.
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  selector:
    matchLabels:
      app: {{ template "logiq-flash.name" . }}
      release: {{ .Release.Name }}
  # Rolling update: 1 pod (3 containers) down at a time; readinessProbe gates traffic.
  updateStrategy:
    type: {{ .Values.flash.updateStrategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.flash.updateStrategy.maxUnavailable }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        storageClassName: {{ .Values.global.persistence.storageClass }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum }}
      labels:
        app: {{ template "logiq-flash.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: logiq-flash
      # Budget: flushCurlTimeoutSeconds + 60s status-poll + 60s SIGTERM-flush + 30s overhead.
      # Set via values.flash.terminationGracePeriodSeconds (default 1050s).
      terminationGracePeriodSeconds: {{ .Values.flash.terminationGracePeriodSeconds }}

      # Zone-only spread — hard podAntiAffinity already covers the hostname dimension.
      {{- if .Values.flash.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.flash.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.flash.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ template "logiq-flash.name" . }}
              release: {{ .Release.Name }}
      {{- end }}

      affinity:
        {{- if .Values.global.nodeSelectors.enabled }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.global.nodeSelectors.label }}
                    operator: In
                    values:
                      - {{ .Values.global.nodeSelectors.ingest }}
        {{- end }}

        podAntiAffinity:
          {{- if .Values.podPerNode }}
          # Hard rule: one logiq-flash pod per node. Pods go Pending if nodes < replicas.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ template "logiq-flash.name" . }}
              topologyKey: kubernetes.io/hostname
          {{- end }}
          # Preferred anti-affinity omitted on hostname — shadowed by the hard rule above.

      {{- if .Values.global.taints.enabled }}
      tolerations:
        - key: dedicated
          operator: Equal
          value: {{ .Values.global.taints.ingest }}
          effect: NoSchedule
      {{- end }}

      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      initContainers:
        - name: check-discovery
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until $(curl --output /dev/null --silent --fail http://flash-discovery:8081/ready);
              do echo "waiting for discovery"; sleep 1; done;

        - name: check-redis
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until redis-cli -h {{ .Values.global.environment.redis_host }} ping;
              do echo "waiting for {{ .Values.global.environment.redis_host }}"; sleep 1; done;

        {{- if .Values.global.chart.s3gateway }}
        - name: check-s3-gateway
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until $(curl --output /dev/null --silent --fail http://s3-gateway:9000/minio/health/ready);
              do echo "waiting for s3-gateway"; sleep 1; done;
        {{- end }}

      volumes:
        {{- if .Values.configurationFiles }}
        - name: config
          configMap:
            {{- if not .Values.configMapName }}
            name: logiq-config
            {{- else }}
            name: {{ .Values.configMapName }}
            {{- end }}
        {{- end }}
        {{- if .Values.secrets_name }}
        - name: certs
          secret:
            secretName: {{ .Values.secrets_name }}
        {{- end }}
        {{- if .Values.global.sharedSecretName }}
        - name: sharedcert
          secret:
            secretName: {{ .Values.global.sharedSecretName }}
        {{- end }}
        {{- if .Values.kafka_client.enabled }}
        - name: apica-kafka-secret
          secret:
            secretName: {{ .Values.kafka_client.secretName | default "ascent-kafka-cert" }}
            defaultMode: 420
            items:
              - key: certificate
                path: tls.crt
              - key: private_key
                path: tls.key
              - key: ca_chain
                path: ca.crt
        {{- end }}
        {{- if .Values.global.environment.s3_custom_ca.enabled }}
        - name: s3-custom-ca
          configMap:
            name: {{ .Values.global.environment.s3_custom_ca.map_name }}
        {{- end }}

      containers:
        # Primary ingest container — receives logs via syslog/CEF/relp/fluentd/filebeat/gRPC.
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
          args:
            - -c
            - /flash/bin/flash -config /flash/config/config.yaml -install_root /flash -runtime_folder /flash/db -discovery_domain $(DISCOVERY_DOMAIN) -discovery_url $(DISCOVERY_URL) -discovery_id flash1 -pg_max_idle_conns 3 -pg_max_open_Conns 5 -postgres_timeout 20s -workers 150 -connection_channel_size 10 --pg_conn_max_lifetime 5m {{ .Values.global.environment.extraflag }} {{- if eq (toString .Values.logflow_only.enabled) "true" }} {{ .Values.logflow_only.args }} {{- else }} {{ .Values.global.environment.rate_limit_flags }} {{- end }} {{- if .Values.kafka_client.enabled }} {{ .Values.kafka_client.kafka_args }} {{- end }}
          # PreStop: blocking flush to S3 before kubelet sends SIGTERM.
          # 1. POST /flush blocks until flush is done (wait=true) or curl timeout fires.
          # 2. Poll /flush/status as a safety net in case wait=true returned early.
          # SIGTERM then triggers a fast second flush (near-instant — data already flushed).
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    t1=$(date +%s%3N); t1h=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
                    echo "{\"ts\":${t1},\"ts_human\":\"${t1h}\",\"event\":\"T1_prestop_flush_start\",\"pod\":\"${HOSTNAME}\"}"

                    resp=$(curl -s \
                      -m {{ .Values.flash.flushCurlTimeoutSeconds }} \
                      -w "\nHTTP_CODE:%{http_code}" \
                      -XPOST "http://localhost:8080/flush?timeout={{ .Values.flash.flushAppTimeoutSeconds }}s&restore=false&wait=true")

                    t2=$(date +%s%3N); t2h=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
                    echo "{\"ts\":${t2},\"ts_human\":\"${t2h}\",\"event\":\"T2_curl_returned\",\"pod\":\"${HOSTNAME}\",\"response\":\"$(echo "$resp" | tr -d '\n')\"}"

                    i=0
                    while [ $i -lt 30 ]; do
                      curl -s -m 5 http://localhost:8080/flush/status | grep -q '"is_flush_complete":true' && break
                      sleep 2
                      i=$((i+1))
                    done

                    t3=$(date +%s%3N); t3h=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
                    echo "{\"ts\":${t3},\"ts_human\":\"${t3h}\",\"event\":\"T3_flush_complete\",\"pod\":\"${HOSTNAME}\"}"
          env:
            - name: CONFIG_HASH
              value: {{ include "logiq-flash.confighash" . | quote }}
            - name: DISCOVERY_URL
              value: http://{{ .Values.discoveryService.name }}:4000
            - name: DISCOVERY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY_DOMAIN
              value: {{ template "logiq-flash.name" . }}-headless
            {{- if .Values.global.environment.parent_host }}
            - name: PARENT_HOST
              value: {{ .Values.global.environment.parent_host }}
            {{- end }}
            {{- if .Values.global.environment.redis_opts }}
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_port
            {{- end }}
            {{- if .Values.global.environment.admin_email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_email
            {{- end }}
            {{- if .Values.global.environment.admin_password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_password
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_db
            {{- if .Values.global.sharedSecretName }}
            - name: S3_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_access
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_secret
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_bucket
            {{- end }}
            {{- if .Values.global.environment.cluster_id }}
            - name: MY_CLUSTER_ID
              value: {{ .Values.global.environment.cluster_id }}
            {{- end }}
            - name: MY_APP_NAME
              value: {{ template "logiq-flash.name" . }}
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          volumeMounts:
            - mountPath: /flash/config
              name: config
            {{- if .Values.kafka_client.enabled }}
            - mountPath: /flash/kafka
              name: apica-kafka-secret
            {{- end }}
            - mountPath: /flash/db
              name: data
            {{- if .Values.secrets_name }}
            - mountPath: /flash/certs
              name: certs
            {{- end }}
            {{- if .Values.global.sharedSecretName }}
            - mountPath: /flash/sharedcerts
              name: sharedcert
            {{- end }}
            {{- if .Values.global.environment.s3_custom_ca.enabled }}
            - mountPath: /etc/ssl/certs/ca.crt
              name: s3-custom-ca
              subPath: ca.crt
            {{- end }}

          ports:
            - name: grpc
              containerPort: 50054
              protocol: TCP
            - name: webcli
              containerPort: 9998
              protocol: TCP
            - name: api
              containerPort: 9999
              protocol: TCP
            - name: syslog
              containerPort: 1514
              protocol: TCP
            - name: syslogtls
              containerPort: 7514
              protocol: TCP
            - name: cefport
              containerPort: 1515
              protocol: TCP
            - name: cefportls
              containerPort: 7515
              protocol: TCP
            - name: tracingapi
              containerPort: 14268
              protocol: TCP
            - name: relp
              containerPort: 20514
              protocol: TCP
            - name: relptls
              containerPort: 2514
              protocol: TCP
            - name: fluentforward
              containerPort: 24224
              protocol: TCP
            - name: fluentfwdtls
              containerPort: 24225
              protocol: TCP
            - name: filebeat
              containerPort: 25224
              protocol: TCP
            - name: filebeatls
              containerPort: 25225
              protocol: TCP
            - name: healthcheck
              containerPort: 8080
              protocol: TCP
            - name: rawtcp
              containerPort: {{ .Values.rawtcp.containerPort }}
              protocol: TCP

          # failureThreshold: 25 intentional — Raft re-election and WAL replay can take minutes.
          # A lower threshold causes restart loops during legitimate recovery.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 25

          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 25

          resources:
            {{- toYaml .Values.resources.ingest | nindent 12 }}

        # Query sidecar — same binary as primary, --sidecar-node flag, separate ports.
        - name: logiq-flash-query
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
          args:
            - -c
            - /flash/bin/flash -config /flash/config/config.yaml -install_root /flash -runtime_folder /flash/db -discovery_domain $(DISCOVERY_DOMAIN) -discovery_url $(DISCOVERY_URL) -discovery_id $(DISCOVERY_ID) -pg_max_idle_conns 3 -pg_max_open_Conns 10 -postgres_timeout 20s --pg_conn_max_lifetime 5m -grpc_port 51054 -health_check_port 18080 --sidecar-node -api_port 19999 {{ .Values.global.environment.extraflag }} {{- if eq (toString .Values.logflow_only.enabled) "true" }} {{ .Values.logflow_only.args }} {{- else }} {{ .Values.global.environment.rate_limit_flags }} {{- end }}
          env:
            - name: CONFIG_HASH
              value: {{ include "logiq-flash.confighash" . | quote }}
            - name: DISCOVERY_URL
              value: http://{{ .Values.discoveryService.name }}:4000
            - name: DISCOVERY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISCOVERY_DOMAIN
              value: {{ template "logiq-flash.name" . }}-headless
            {{- if .Values.global.environment.redis_opts }}
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: redis_port
            {{- end }}
            {{- if .Values.global.environment.admin_email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_email
            {{- end }}
            {{- if .Values.global.environment.admin_password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: admin_password
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ template "logiq-flash.fullname" . }}
                  key: postgres_db
            {{- if .Values.global.sharedSecretName }}
            - name: S3_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_access
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_secret
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_bucket
            {{- end }}
            {{- if .Values.global.environment.cluster_id }}
            - name: MY_CLUSTER_ID
              value: {{ .Values.global.environment.cluster_id }}
            {{- end }}
            - name: MY_APP_NAME
              value: {{ template "logiq-flash.name" . }}
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          ports:
            - containerPort: 51054
              name: grpc
              protocol: TCP
            - containerPort: 8899
              name: webcli
              protocol: TCP
            - containerPort: 19999
              name: api
              protocol: TCP
            - containerPort: 18080
              name: healthcheck
              protocol: TCP

          # failureThreshold: 25 intentional — same Raft/WAL recovery as primary container.
          readinessProbe:
            httpGet:
              path: /ready
              port: 18080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 25

          livenessProbe:
            httpGet:
              path: /ready
              port: 18080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 25

          volumeMounts:
            - mountPath: /flash/config
              name: config
            - mountPath: /flash/db
              name: data
            {{- if .Values.secrets_name }}
            - mountPath: /flash/certs
              name: certs
            {{- end }}
            {{- if .Values.global.sharedSecretName }}
            - mountPath: /flash/sharedcerts
              name: sharedcert
            {{- end }}
            {{- if .Values.global.environment.s3_custom_ca.enabled }}
            - mountPath: /etc/ssl/certs/ca.crt
              name: s3-custom-ca
              subPath: ca.crt
            {{- end }}

          resources:
            {{- toYaml .Values.resources.sidecarQuery | nindent 12 }}

        # Jaeger collector sidecar — receives traces via gRPC, stores via localhost:50054.
        - name: {{ .Chart.Name }}-tracing
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.sidecarTracing.image }}:{{ .Values.sidecarTracing.tag }}"
          imagePullPolicy: {{ .Values.sidecarTracing.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              while true
              do
              /go/bin/collector-linux --grpc-storage.server=localhost:50054
              sleep 5
              done
          env:
            - name: SPAN_STORAGE_TYPE
              value: grpc-plugin

          ports:
            - containerPort: 14250
              name: tracing-2
              protocol: TCP
            - containerPort: 14268
              name: tracing-1
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: 14250
            initialDelaySeconds: 25
            periodSeconds: 25
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 3

          # failureThreshold: 3 — tracing sidecar has no state; fast restart is safe.
          livenessProbe:
            tcpSocket:
              port: 14250
            initialDelaySeconds: 30
            periodSeconds: 25
            timeoutSeconds: 125
            successThreshold: 1
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources.sidecarTracing | nindent 12 }}