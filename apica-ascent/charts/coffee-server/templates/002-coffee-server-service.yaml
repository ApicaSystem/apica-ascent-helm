apiVersion: v1
kind: Service
metadata:
  name: coffee
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: "http"
    port: {{ .Values.coffee.port }}
    targetPort: {{ .Values.coffee.targetPort }}
  selector:
    app: coffee-server
status:
  loadBalancer: {}
