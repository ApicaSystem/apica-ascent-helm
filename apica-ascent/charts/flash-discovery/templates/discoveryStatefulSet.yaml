apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ template "flash-discovery.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "flash-discovery.name" . }}
    chart: {{ template "flash-discovery.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  serviceName: {{ template "flash-discovery.name" . }}
  replicas: {{ .Values.replicaCountDiscovery }}
  selector:
    matchLabels:
      app: {{ template "flash-discovery.name" . }}
      release: {{ .Release.Name }}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
      annotations:
        argocd.argoproj.io/sync-options: Delete=false
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
      storageClassName: {{ .Values.global.persistence.storageClass }}
  template:
    metadata:
      labels:
        app: {{ template "flash-discovery.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: flash-discovery
      {{- if .Values.global.nodeSelectors.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: {{ .Values.global.nodeSelectors.label }}
                operator: In
                values:
                - {{ .Values.global.nodeSelectors.infra }}
      {{- end }}
      {{- if .Values.global.taints.enabled }}
      tolerations:
      - key: dedicated
        operator: Equal
        value: {{ .Values.global.taints.infra }}
        effect: NoSchedule
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: check-postgres
        image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_password
          - name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_host
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: database_url
        command: ['sh', '-c', 
          'until pg_isready -h $(POSTGRES_HOST) -p {{ .Values.global.environment.postgres_port}} -d $(DATABASE_URL);
          do echo waiting for database; sleep 1; done;']
      {{ if .Values.useSecret }}
      imagePullSecrets:
        - name: {{ required "pullSecretName is required" .Values.pullSecretName }}
      {{ end }}
      volumes:
        {{ if .Values.configurationFiles }}
        - name: config
          configMap:
            name: {{ template "flash-discovery.name" . }}-config
        {{ end }}
        {{ if .Values.secrets }}
        - name: certs
          secret:
            secretName: {{ template "flash-discovery.name" . }}-certs
        {{ end }}
        {{ if .Values.global.environment.license }}
        - name: license
          secret:
            secretName: {{ template "flash-discovery.fullname" . }}-license
        {{ end }}
        {{ if .Values.global.sharedSecretName }}
        - name: sharedcert
          secret:
            secretName: {{ .Values.global.sharedSecretName }}
        {{ end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: CONFIG_HASH
            value: {{ include "flash-discovery.confighash" . | quote }}
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_password
          - name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_host
          - name: POSTGRES_PORT
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_port
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: {{ template "flash-discovery.fullname" . }}
                key: postgres_db
          - name: MY_APP_NAME
            value: {{ template "flash-discovery.name" . }}
          - name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MY_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: MY_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MY_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP                
          {{ if .Values.global.environment.cluster_id }}  
          - name: MY_CLUSTER_ID
            value: {{ .Values.global.environment.cluster_id }}
          {{ end }}      
          volumeMounts:
          - mountPath: /flash/db
            name: data
          {{ if .Values.secrets }}
          - mountPath: /flash/certs
            name: certs
          {{ end }}
          {{ if .Values.global.environment.license }}
          - mountPath: /flash/license
            name: license
          {{ end }}
          {{ if .Values.global.sharedSecretName }}
          - mountPath: /flash/sharedcerts
            name: sharedcert
          {{ end }}
          ports:
            - name: healthcheck
              containerPort: {{ .Values.discoveryHealth.port }}
              protocol: TCP
            - name: discovery
              containerPort: {{ .Values.discoveryAPI.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: healthcheck
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: healthcheck
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 10             
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{ with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{ end }}
    {{ with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{ end }}
    {{ with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{ end }}
