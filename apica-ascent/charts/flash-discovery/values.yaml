# Default values for logiq-flash.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCountDiscovery: 1
useSecret: false
pullSecretName:

# ── High-availability scheduling controls ──────────────────────────────────────

# Feature 1: topologySpreadConstraints — soft spread across nodes and zones.
# ScheduleAnyway means a pod is never left Pending due to topology skew.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# Feature 2: preferred pod anti-affinity — weight 100, never blocks scheduling.
podAntiAffinity:
  enabled: true
  weight: 100

# Feature 4: rolling update — 1 pod unavailable at a time.
updateStrategy:
  type: RollingUpdate
  maxUnavailable: 1

# Feature 5: graceful shutdown — preStop(15s) fills LB-drain gap before SIGTERM.
# terminationGracePeriodSeconds is the hard ceiling for the full shutdown sequence.
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 15

# Feature 3: PodDisruptionBudget — keep N-1 pods alive during drains/upgrades.
# For replicaCountDiscovery=2 (root values.yaml override) → minAvailable=1.
pdb:
  enabled: true
  minAvailable: 1

image:
  repository: logiqai/flash-discovery
  tag: 1.0.0
  pullPolicy: IfNotPresent

discoveryService:
  type: LoadBalancer

discoveryHealth:
  port: 8081
  name: discovery-health

discoveryAPI:
  port: 4000
  name: discovery-api

## Persist data to a persistent volume
persistence:
  enabled: true
  ## database data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  ## gp2 - aws
  #storageClassName: gp2
  ## do-block-storage - digitalocean
  #storageClassName: do-block-storage
  ## standard - minikube
  storageClassName: standard
  accessMode: ReadWriteOnce
  size: 2Gi

configurationFiles: false
secrets: false
podPerNode: true

resources:
  requests:
    cpu: 100m
    memory: 100Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

global:
  sharedSecretName: logiq-shared-secret
  nodeSelectors:
    enabled: false
    label: apica-node-pool
    ingest: ingest
    infra: base
    other: base
    db: common
    cache: common
    ingest_sync: sync
  taints:
    enabled: false
    ingest: flash
    infra: infra
    other: coffee
    db: db
    cache: cache
    ingest_sync: sync
  toolbox:
    image:
      repository: logiqai/toolbox
      tag: 2.0.1
  environment:
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    license: "license/license.jws"
    upload_dashboard: true
    cluster_id: demo
  persistence:
    storageClass: oci-bv
