{{- if .Values.backups.endpointCA.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backups.endpointCA.name | default (printf "%s-ca-bundle" (include "cluster.fullname" .)) | quote }}
  namespace: {{ include "cluster.namespace" . }}
data:
  {{ .Values.backups.endpointCA.key | default "ca-bundle.crt" | quote }}: {{ .Values.backups.endpointCA.value }}
{{- end }}
{{- if and (eq .Values.mode "recovery") .Values.recovery.endpointCA.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.recovery.endpointCA.name | default (printf "%s-recovery-ca-bundle" (include "cluster.fullname" .)) | quote }}
  namespace: {{ include "cluster.namespace" . }}
data:
  {{ .Values.recovery.endpointCA.key | default "ca-bundle.crt" | quote }}: {{ .Values.recovery.endpointCA.value }}
{{- end }}
