apiVersion: v1
kind: Service
metadata:
  name: ssr-report-gen
  namespace: {{ .Release.Namespace }}
spec:
  # This is the StatefulSet's governing service. Not headless (no clusterIP:
  # None) since per-pod DNS isn't needed here — coffee-worker only talks to
  # ssr-report-gen via the ClusterIP, load-balanced across all pods.
  type: ClusterIP
  ports:
  - name: "http"
    port: {{ .Values.ssr_report_gen.port }}
    targetPort: {{ .Values.ssr_report_gen.targetPort }}
  selector:
    app: ssr-report-gen
