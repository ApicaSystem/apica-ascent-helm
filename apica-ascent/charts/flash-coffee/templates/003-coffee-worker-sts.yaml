apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: coffee-worker-deployment
  name: coffee-worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.coffee_worker.replicaCount }}
  serviceName: coffee
  selector:
    matchLabels:
      app: coffee-worker
  # Rolling update: 1 pod down at a time; readinessProbe gates traffic during rollout.
  updateStrategy:
    type: {{ .Values.coffee_worker.updateStrategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.coffee_worker.updateStrategy.maxUnavailable }}
  template:
    metadata:
      labels:
        app: coffee-worker
    spec:
      serviceAccountName: flash-coffee
      # preStop(15s) fills the LB-drain gap before SIGTERM; 60s is the hard ceiling.
      terminationGracePeriodSeconds: {{ .Values.coffee_worker.terminationGracePeriodSeconds }}

      # Soft spread across nodes and zones — ScheduleAnyway never blocks scheduling.
      {{- if .Values.coffee_worker.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.coffee_worker.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.coffee_worker.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: coffee-worker
        - maxSkew: {{ .Values.coffee_worker.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.coffee_worker.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: coffee-worker
      {{- end }}

      affinity:
        {{- if .Values.global.nodeSelectors.enabled }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.global.nodeSelectors.label }}
                    operator: In
                    values:
                      - {{ .Values.global.nodeSelectors.other }}
        {{- end }}
        # Preferred anti-affinity: adds scheduling pressure without ever blocking.
        {{- if .Values.coffee_worker.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.coffee_worker.podAntiAffinity.weight }}
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: coffee-worker
        {{- end }}

      {{- if .Values.global.taints.enabled }}
      tolerations:
        - key: dedicated
          operator: Equal
          value: {{ .Values.global.taints.other }}
          effect: NoSchedule
      {{- end }}

      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      {{- if .Values.useSecret }}
      imagePullSecrets:
        - name: {{ required "pullSecretName is required" .Values.pullSecretName }}
      {{- end }}

      initContainers:
        - name: check-redis
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until redis-cli
              {{- if and .Values.global.environment.redis_tls.enabled .Values.tls.redis.caCert }} --tls --cacert {{ .Values.tls.redis.caCert }}
              {{- else if .Values.global.environment.redis_tls.enabled }} --tls
              {{- end }}
              -h {{ .Values.global.environment.redis_host }} ping;
              do echo "waiting for {{ .Values.global.environment.redis_host }}"; sleep 1; done;
          {{- if and .Values.global.environment.redis_tls.enabled .Values.tls.certSecretName }}
          volumeMounts:
            - mountPath: /coffee/certs
              name: tls-certs
          {{- end }}

        - name: check-postgres
          image: {{ .Values.global.imageRegistry }}/{{ .Values.global.toolbox.image.repository }}:{{ .Values.global.toolbox.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_host
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: database_url
          command:
            - sh
            - -c
            - >
              until pg_isready -h $(POSTGRES_HOST) -p {{ .Values.global.environment.postgres_port }}
              -d $(DATABASE_URL); do echo waiting for database; sleep 1; done;

      volumes:
        {{- if .Values.global.sharedSecretName }}
        - name: sharedcert
          secret:
            secretName: {{ .Values.global.sharedSecretName }}
        {{- end }}
        {{- if .Values.tls.certSecretName }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.certSecretName }}
        {{- end }}

      containers:
        - name: coffee-worker
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.coffee_worker.image.repository }}:{{ .Values.coffee_worker.image.tag }}"
          imagePullPolicy: {{ .Values.coffee_worker.image.pullPolicy }}
          args:
            - scheduler
          # Sleep before SIGTERM so in-flight tasks can complete before shutdown.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.coffee_worker.preStopSleepSeconds }}"]
          env:
            - name: CONFIG_HASH
              value: {{ include "flash-coffee.confighash" . | quote }}
            - name: PYTHONUNBUFFERED
              value: "0"
            - name: SSR_HOST
              value: 0.0.0.0
            - name: COOKIE_SECRET
              value: d84c0edd-ab5e-4664-b0ee-2cd15a9ae5f0
            - name: QUEUES
              value: queries,scheduled_queries,celery
            - name: LOG_LEVEL
              value: ERROR
            {{- if .Values.global.environment.parent_host }}
            - name: PARENT_HOST
              value: {{ .Values.global.environment.parent_host }}
            {{- end }}
            {{- if .Values.global.domain }}
            - name: HOST
              value: {{ .Values.global.domain }}
            {{- end }}
            - name: MY_APP_NAME
              value: coffee-worker
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.global.environment.cluster_id }}
            - name: MY_CLUSTER_ID
              value: {{ .Values.global.environment.cluster_id }}
            {{- end }}
            - name: LOGIQ_FLASH_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: logiq_flash_host
            - name: LOGIQ_FLASH_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: logiq_flash_port
            - name: WORKERS_COUNT
              value: "{{ .Values.coffee_worker.replicaCount }}"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: redis_host
            - name: REDIS_URL
              value: {{ if .Values.global.environment.redis_tls.enabled }}rediss{{ else }}redis{{ end }}://{{ .Values.global.environment.redis_host }}:{{ .Values.global.environment.redis_port }}/0
            {{- if .Values.global.environment.redis_tls.enabled }}
            {{- if .Values.tls.redis.caCert }}
            - name: REDIS_SSL_CA_CERTS
              value: {{ .Values.tls.redis.caCert }}
            {{- end }}
            - name: REDIS_SSL_CERT_REQS
              value: {{ .Values.global.environment.redis_tls.cert_reqs | default "required" }}
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_db
            - name: POSTGRES_COFFEE_DB
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: postgres_coffee_db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: coffee_database_url
            - name: S3_URL
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: s3_url
            - name: S3_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_access
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_secret
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.sharedSecretName }}
                  key: s3_bucket
            {{- if .Values.global.environment.admin_name }}
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: admin_name
            {{- end }}
            {{- if .Values.global.environment.admin_password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: admin_password
            {{- end }}
            {{- if .Values.global.environment.admin_org }}
            - name: ADMIN_ORG
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: admin_org
            {{- end }}
            {{- if .Values.global.environment.admin_email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: admin_email
            {{- end }}
            {{- if .Values.global.environment.mail_server }}
            - name: MAIL_SERVER
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: mail_server
            {{- end }}
            {{- if .Values.global.environment.mail_port }}
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: mail_port
            {{- end }}
            {{- if .Values.global.environment.mail_username }}
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: mail_username
            {{- end }}
            {{- if .Values.global.environment.mail_password }}
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: mail_password
            {{- end }}
            {{- if .Values.global.environment.mail_default_sender }}
            - name: MAIL_DEFAULT_SENDER
              valueFrom:
                secretKeyRef:
                  name: {{ template "flash-coffee.fullname" . }}
                  key: mail_default_sender
            {{- end }}
            {{- if .Values.global.chart.prometheus }}
            - name: PROM_ALERT_MGR_URL
              value: {{ .Release.Name }}-prometheus-alertmanager:9093
            {{- end }}
            - name: EVENT_REPORTING_WEBHOOKS
              value: ""
            - name: LOGIQ_AUDIT_EVENT_GROUP
              value: logiq-audit

          volumeMounts:
            {{- if .Values.global.sharedSecretName }}
            - name: sharedcert
              mountPath: /app/sharedcerts
            {{- end }}
            {{- if .Values.tls.certSecretName }}
            - name: tls-certs
              mountPath: /coffee/certs
            {{- end }}

          # tcpSocket on port 5173 (ssr-report-gen sidecar) — no HTTP port on the worker itself.
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          {{- if .Values.coffee_worker.resources }}
          resources:
            {{- toYaml .Values.coffee_worker.resources | nindent 12 }}
          {{- end }}

        - name: ssr-report-gen
          image: {{ .Values.global.imageRegistry }}/logiqai/ssr-server:ssr-v4.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SSR_HOST
              value: 0.0.0.0
            - name: __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
              value: coffee
          ports:
            - containerPort: 5173
              name: ssr
              protocol: TCP
          resources: {}

      restartPolicy: Always
