{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "flash-coffee.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "flash-coffee.name" . }}
    chart: {{ template "flash-coffee.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  mail_server: {{ if .Values.global.environment.mail_server }}{{ .Values.global.environment.mail_server | b64enc | quote }} {{ end }}
  mail_port: {{ if .Values.global.environment.mail_port }}{{ .Values.global.environment.mail_port | toString | b64enc | quote }} {{ end }}
  mail_username: {{ if .Values.global.environment.mail_username }}{{ .Values.global.environment.mail_username | b64enc | quote }} {{ end }}
  mail_password: {{ if .Values.global.environment.mail_password }}{{ .Values.global.environment.mail_password | b64enc | quote }} {{ end }}
  mail_default_sender: {{ if .Values.global.environment.mail_default_sender }}{{ .Values.global.environment.mail_default_sender | b64enc | quote }} {{ end }}
  postgres_coffee_db: {{ if .Values.global.environment.postgres_coffee_db }}{{ .Values.global.environment.postgres_coffee_db | b64enc | quote }} {{ end }}
  logiq_flash_host: {{ if .Values.global.environment.logiq_flash_host }}{{ .Values.global.environment.logiq_flash_host | b64enc | quote }} {{ end }}
  logiq_flash_port: {{ if .Values.global.environment.logiq_flash_port }}{{ .Values.global.environment.logiq_flash_port | toString | b64enc | quote }} {{ end }}
  s3_access: {{ if .Values.global.environment.s3_access }}{{ .Values.global.environment.s3_access | b64enc | quote }} {{ end }}
  s3_secret: {{ if .Values.global.environment.s3_secret }}{{ .Values.global.environment.s3_secret | b64enc | quote }} {{ end }}
  s3_bucket: {{ if .Values.global.environment.s3_bucket }}{{ .Values.global.environment.s3_bucket | b64enc | quote }} {{ end }}
  s3_url: {{ if .Values.global.environment.s3_url }}{{ .Values.global.environment.s3_url | b64enc | quote }} {{ end }}
  admin_email: {{ if .Values.global.environment.admin_email }}{{ .Values.global.environment.admin_email | b64enc | quote }}{{ end }}
  admin_password: {{ if .Values.global.environment.admin_password }}{{ .Values.global.environment.admin_password | b64enc | quote }}{{ end }}
  admin_name: {{ if .Values.global.environment.admin_name }}{{ .Values.global.environment.admin_name | b64enc | quote }}{{ end }}
  admin_org: {{ if .Values.global.environment.admin_org }}{{ .Values.global.environment.admin_org | b64enc | quote }}{{ end }}
  postgres_port: {{ if .Values.global.environment.postgres_port }}{{ .Values.global.environment.postgres_port | b64enc | quote }} {{ end }}
  postgres_host: {{ if .Values.global.environment.postgres_host }}{{ .Values.global.environment.postgres_host | b64enc | quote }} {{ end }}
  postgres_password: {{ if .Values.global.environment.postgres_password }}{{ .Values.global.environment.postgres_password | b64enc | quote }} {{ end }}
  postgres_db: {{ if .Values.global.environment.postgres_db }}{{ .Values.global.environment.postgres_db | b64enc | quote }} {{ end }}
  postgres_user: {{ if .Values.global.environment.postgres_user }}{{ .Values.global.environment.postgres_user | b64enc | quote }} {{ end }}
  redis_host: {{ if .Values.global.environment.redis_host }}{{ .Values.global.environment.redis_host | b64enc | quote }} {{ end }}
  redis_port: {{ if .Values.global.environment.redis_port }}{{ .Values.global.environment.redis_port | toString | quote }} {{ end }}
  {{- $env := .Values.global.environment }}
  {{- $pgURL := printf "postgresql://%s:%s@%s:%s/%s" $env.postgres_user $env.postgres_password $env.postgres_host $env.postgres_port $env.postgres_db }}
  {{- $coffeeURL := printf "postgresql://%s:%s@%s:%s/%s" $env.postgres_user $env.postgres_password $env.postgres_host $env.postgres_port $env.postgres_coffee_db }}
  {{- if $env.postgres_tls.enabled }}
  {{- $q := printf "?sslmode=%s" $env.postgres_tls.sslmode }}
  {{- if $.Values.tls.postgres.caCert }}
  {{- $q = printf "%s&sslrootcert=%s" $q $.Values.tls.postgres.caCert }}
  {{- end }}
  {{- if $env.postgres_tls.mtls }}
  {{- $q = printf "%s&sslcert=/coffee/certs/pg-client.crt&sslkey=/coffee/certs/pg-client.key" $q }}
  {{- end }}
  {{- $pgURL = printf "%s%s" $pgURL $q }}
  {{- $coffeeURL = printf "%s%s" $coffeeURL $q }}
  {{- end }}
  database_url: {{ $pgURL | b64enc | quote }}
  coffee_database_url: {{ $coffeeURL | b64enc | quote }}

  {{- end }}
