# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
useSecret: false
pullSecretName:

coffee:
  name: coffee
  port: 80
  targetPort: 5000
  replicaCount: 2
  web_workers: 4
  image: 
    repository: logiqai/flash-brew-coffee
    tag: brew.1.2.0
    pullPolicy: IfNotPresent
  resources: {}
    

coffee_worker:
  image:
    repository: logiqai/flash-brew-coffee
    tag: brew.1.2.0
    pullPolicy: IfNotPresent
  replicaCount: 3
  resources: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  tls: []
  hosts: ["a", "b", "192.168.99.100"]

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

global:
  domain: null
  nodePort:
    enabled: false
    ports:
      flash: null
      flashMl: null
  sharedSecretName: logiq-shared-secret
  environment:
    logiq_flash_host: logiq-flash
    logiq_flash_port: 9999
    redis_opts: true
    redis_host: "redis-master"
    redis_port: "6379"
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    s3_url: "http://s3-gateway:9000"
    s3_access: "logiq_access"
    s3_secret: "logiq_secret"
    s3_region: "us-east-1"
    mail_server: "smtp-mail-server"
    mail_port: "587"
    mail_username: "user"
    mail_password: "password"
    mail_default_sender: "flash-admin@foo.com"
    admin_name: "flash-admin@foo.com"
    admin_password: "flash-password"
    admin_org: "flash-org"
    admin_email: "flash-admin@foo.com"
    cluster_id: demo
    gacode: ""
  persistence:
    storageClass: oci-bv
