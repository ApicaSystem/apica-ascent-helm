{{- if .Values.global.environment.upload_dashboard }}
# Role binding for default pod security policy granting all authenticated users access
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logiqctl
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiqctl.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logiqctl
subjects:
- kind: ServiceAccount
  name: logiqctl
  namespace: {{ .Release.Namespace }}
{{- end }}
