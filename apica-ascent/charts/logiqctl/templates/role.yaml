{{- if .Values.global.environment.upload_dashboard }}
# Role which grants access to the default pod security policy
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logiqctl
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "logiqctl.name" . }}
rules:
- apiGroups:
  - policy
  resourceNames:
  - logiqctl
  resources:
  - podsecuritypolicies
  verbs:
  - use
- apiGroups:
  - extensions
  resourceNames:
  - logiqctl
  resources:
  - podsecuritypolicies
  verbs:
  - use
{{- end }}
