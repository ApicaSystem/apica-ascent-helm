logiq-flash:
  replicaCount: 2
  replicaCountMl: 2
  replicaCountSync: 2
  service:
    type: NodePort
  image:
    repository: logiqai/flash
    tag: v4.0.1
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 100Gi
    ml_size: 20Gi
  metrics:
    serviceMonitor:
      enabled: true
    selector:
      release: prometheus
  resources:
    ingest:
      requests:
        cpu: 1250m
        memory: 3500Mi
      limits:
        memory: 4000Mi
    sidecarQuery:
      requests:
        memory: 100Mi
      limits:
        memory: 4000Mi
    sidecarTracing:
      requests:
        memory: 20Mi
      limits:
        memory: 4000Mi

    ml:
      requests:
        cpu: 100m
        memory: 900Mi
      limits:
        memory: 1500Mi  

    sidecarMlTracing:
      requests:
        memory: 20Mi
      limits:
        memory: 1500Mi

    sync:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 750Mi
  logflow_only:
    enabled: false
    args: '-object_writers=1 -max_bytes_per_sec=1246485'
  kafka_client:
    enabled: true
    kafka_args: "-kafka_ca_cert_path=/flash/kafka/ca.crt -kafka_client_key_path=/flash/kafka/tls.key -kafka_client_cert_path=/flash/kafka/tls.crt"
flash-discovery:
  fullnameOverride: flash-discovery
  image:
    repository: logiqai/flash-discovery
    tag: 2.0.3
    pullPolicy: IfNotPresent
  replicaCountDiscovery: 2
  persistence:
    enabled: true
    size: 2Gi
  resources:
    limits:
      memory: 100Mi
    requests:
      cpu: 10m
      memory: 16Mi

redis:
  enabled: true
  fullnameOverride: redis
  usePassword: false
  cluster:
    slaveCount: 0
  master:
    resources:
      limits:
        memory: 6000Mi
      requests:
        memory: 500Mi
        cpu: 100m
    disableCommands: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis
            topologyKey: "kubernetes.io/hostname"
    persistence:
      enabled: false
  slave:
    disableCommands: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis
            topologyKey: "kubernetes.io/hostname"
    persistence:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    selector:
      release: prometheus
  podSecurityPolicy:
    create: true
    rbac:
      create: true
      role:
        rules:
          - apiGroups:
              - policy
            resources:
              - podsecuritypolicies
            verbs:
              - use
            resourceNames:
              - redis
  securityContext:
    enable: true
    fsGroup: 1001
    runAsUser: 1001
  serviceAccount:
    create: true
    name: redis

postgres:
  enabled: true
  fullnameOverride: postgres
  postgresqlPostgresPassword: postgres
  postgresqlUsername: postgres
  postgresqlDatabase: postgres
  postgresqlPassword: postgres
  postgresqlExtendedConf:
    maxConnections: "400"
    sharedBuffers: "1024MB"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    additionalLabels:
      release: prometheus
  persistence:
    size: 20Gi
  resources:
    limits:
      memory: 20000Mi
    requests:
      memory: 4000Mi
      cpu: 500m
  securityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
  serviceAccount:
    enabled: true
    name: postgres

coffee-server:
  service:
    type: ClusterIP
  coffee:
    replicaCount: 2
    image:
      repository: logiqai/flash-brew-coffee
      tag: v4.0.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: 300Mi
        cpu: 100m
      limits:
        memory: 1000Mi
  coffee_worker:
    replicaCount: 2
    image:
      repository: logiqai/flash-brew-coffee
      tag: v4.0.1
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: 600Mi
        cpu: 100m
      limits:
        memory: 2000Mi

thanos:
  createObjstoreSecret: true
  receive:
    logLevel: info
    service:
      type: ClusterIP
    enabled: true
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
  query:
    enabled: true
    dnsDiscovery:
      enabled: true
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
  bucketweb:
    enabled: true
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
  compactor:
    enabled: true
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
    persistence:
      enabled: true
      size: 75Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  storegateway:
    enabled: true
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
  ruler:
    enabled: true
    alertmanagers:
      - prometheus-alertmanager
    existingConfigmap: thanos-ruler-configmap
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi

# Gateway API configuration
gateway:
  tls:
    enabled: true
    secretName: ascent-external-cert

# Envoy Gateway Configuration for Oracle Cloud (OKE)
envoyGateway:
  enabled: true
  updateStrategy:
    type: RollingUpdate
    maxSurge: 2
    maxUnavailable: 0

  controller:
    clusterRoleName: eg-gateway-helm-envoy-gateway-role
    image: docker.io/envoyproxy/gateway:v1.6.0
    imagePullPolicy: IfNotPresent
    clusterDomain: cluster.local
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  certgen:
    resources: {}

  # GatewayClass configuration
  gatewayClass:
    controllerName: ""
    description: "Envoy Gateway for Apica Ascent"

  # EnvoyProxy configuration
  envoyProxy:
    provider:
      type: Kubernetes
      deployment:
        replicaCount: 4
      service:
        type: LoadBalancer
        # OCI Load Balancer annotations
        annotations:
          service.beta.kubernetes.io/oci-load-balancer-shape: flexible
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "30"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
          oci-load-balancer.oraclecloud.com/health-check: '{"protocol":"HTTP","port":19003,"urlPath":"/ready","returnCode":200,"retries":2,"timeoutInMillis":5000}'
          service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false

  # Gateway listeners configuration
  listeners:
    http:
      port: 80
      protocol: HTTP
    https:
      port: 443
      protocol: HTTPS
    tcp:
      - name: tcp-9999
        port: 9999
        protocol: TCP
      - name: tcp-8081
        port: 8081
        protocol: TCP
      - name: tcp-14250
        port: 14250
        protocol: TCP
      - name: tcp-20514
        port: 20514
        protocol: TCP
      - name: tcp-14268
        port: 14268
        protocol: TCP

  # Compression configuration using BackendTrafficPolicy compressor field
  compressor:
    enabled: true
    # Compression quality (1-9, where 6 is default, 9 is best compression)
    quality: 6
apicaTLSSecret:
  enabled: true

prometheus:
  fullnameOverride: prometheus
  persistence:
    enabled: true
    size: 20Gi
  alertmanager:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
  prometheus:
    enabled: true
    resources:
      requests:
        memory: 15Gi
        cpu: 300m
      limits:
        memory: 15Gi
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
    thanos:
      create: true
      objectStorageConfig:
        secretName: thanos-objstore-secret
        secretKey: objstore.yml
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 200Mi
  operator:
    enabled: true
    replicaCount: 1
    kubeletService:
      enabled: false
  kube-state-metrics:
    serviceMonitor:
      enabled: false
  node-exporter:
    serviceMonitor:
      enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
    service:
      enabled: false
  kubeScheduler:
    enabled: false
    service:
      enabled: false
  kubelet:
    enabled: false
  coreDns:
    enabled: false
    service:
      enabled: false
  kubeProxy:
    enabled: false
    service:
      enabled: false
  exporters:
    node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false

grafana:
  fullnameOverride: grafana

logiqctl:
  image:
    repository: logiqai/logiqctl
    tag: 2.0.4
    pullPolicy: IfNotPresent

global:
  domain: null
  # Set this to the hostname of a private registry for air-gapped environments
  imageRegistry: "docker.io"
  kubeDistributor:
    enabled: false
  cloudProvider: aws
  # NodePort Configuration
  nodePort:
    enabled: true # Set to true to enable NodePort services
    ports:
      flash: null               # null = Kubernetes auto-assigns (recommended for multi-tenancy)
      flashMl: null             # or set to specific port for manual assignment
      thanosReceiveHttp: null   # Thanos Receive HTTP port (default: auto-assign)
      thanosReceiveGrpc: null   # Thanos Receive gRPC port (default: auto-assign)
      thanosReceiveRemote: null # Thanos Receive remote write port (default: auto-assign)
  createStorageClass: false
  enableMetricsServer: false
  sharedSecretName: logiq-shared-secret
  nodeSelectors:
    enabled: true
    label: apica-node-pool
    ingest: ingest
    infra: base
    other: base
    db: common
    cache: common
    ingest_sync: base
  taints:
    enabled: false
    ingest: flash
    infra: infra
    other: coffee
    db: db
    cache: cache
    ingest_sync: sync
  job:
    ttlSecondsAfterFinished: 100
  toolbox:
    image:
      repository: logiqai/toolbox
      tag: 2.0.1
  environment:
    logiq_flash_host: logiq-flash
    logiq_flash_port: 9999
    redis_opts: true
    redis_host: "redis-master"
    redis_port: "6379"
    # When migrating to CNPG, update these values to point to the new CNPG service.
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    s3_url: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
    s3_access: "s3_access"
    s3_secret: "s3_secret"
    s3_bucket: "bucket-name"
    s3_region: "region"
    s3_custom_ca:
      enabled: false
      map_name: "kube-root-ca.crt"
    AWS_ACCESS_KEY_ID: "s3_access"
    AWS_SECRET_ACCESS_KEY: "s3_secret"
    admin_name: "devops@apica.io"
    admin_password: "password"
    admin_org: "flash-org"
    admin_email: "flash-admin@foo.com"
    license: "license/license.jws"
    upload_dashboard: false
    cluster_id: LOGIQ
    awsServiceEndpoint: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
    external_cert_crt: ""
    external_cert_key: ""
    internal_cert_crt: ""
    internal_cert_key: ""
    extraflag: "-hauler-node-affinity=false --tail_longpoll=true -persist=true -rl_type=tokenbucket"
    rate_limit_flags: "-max_bytes_per_sec=346729"
  persistence:
    storageClass: oci-bv
  chart:
    prometheus: true
    postgres: true
    redis: true
    s3gateway: false
    grafana: false

cnpg:
  # -- Set to true to deploy a CloudNativePG cluster via the cnpg/cluster subchart.
  enabled: true

  # -- Override the cluster name. Defaults to <release-name>-cnpg.
  # The CNPG read-write service will be <fullnameOverride>-rw (or <release-name>-cnpg-rw if unset).
  fullnameOverride: ""
  # -- Override the namespace. Defaults to the release namespace.
  namespaceOverride: ""

  # -- Credentials used to pre-create the superuser Secret referenced by cluster.superuserSecret.
  # The application connects to CNPG using these credentials via global.environment.postgres_*.
  superuserSecret:
    name: ascent-db-superuser
    username: postgres
    password: postgres

  # -- Cluster mode of operation.
  # "standalone" creates a fresh cluster.
  # "recovery" bootstraps from an existing Postgres instance via import (use for migration from Bitnami).
  mode: standalone

  # -- Recovery / migration configuration. Required when mode is "recovery".
  # Two recovery methods are supported:
  #
  # 1. Import from a live Postgres (Bitnami migration):
  #    method: import  (default)
  #
  # 2. Restore from a barman object store backup:
  #    method: object_store
  #    recovery:
  #      method: object_store
  #      clusterName: "<release-name>"   # serverName in backup — directory name in bucket, e.g. s3://bucket/cnpg-test/ → "cnpg-test"
  #      pitrTarget:
  #        time: ""                      # Optional RFC3339 timestamp for PITR; leave empty for latest backup
  #      provider: s3                    # or azure / google
  #      endpointURL: "https://<namespace>.compat.objectstorage.<region>.oraclecloud.com"
  #      s3:
  #        region: "<region>"
  #        bucket: "<bucket-name>"
  #        path: "/"
  #        accessKey: ""
  #        secretKey: ""
  #      secret:
  #        create: true                  # cluster subchart creates the S3 credentials Secret
  recovery:
    method: import
    import:
      # "monolith" imports all databases and roles. "microservice" imports a single database.
      type: monolith
      databases:
        - "*"
      roles:
        - "*"
      source:
        host: postgres
        port: 5432
        username: postgres
        database: postgres
        # Use "disable" for in-cluster migration without TLS; "verify-full" for external sources.
        sslMode: disable
        passwordSecret:
          name: cnpg-import-source-password
          key: password
          # Secret is created by templates/cnpg-secrets.yaml when mode is "recovery".
          value: postgres

  cluster:
    instances: 2
    imageName: ghcr.io/cloudnative-pg/postgresql:18
    storage:
      size: 50Gi
    enableSuperuserAccess: true
    # -- References the superuser secret created above.
    superuserSecret: ascent-db-superuser
    services:
      disabledDefaultServices:
        - ro
        - r
    # Required for OCI Object Storage S3-compatible endpoint:
    # - awsDefaultRegion: ensures SigV4 signing uses the correct region
    # - awsRequestChecksumCalculation=when_required: disables botocore 1.35+ trailing
    #   checksum behavior which switches to chunked encoding; OCI requires Content-Length.
    awsDefaultRegion: us-ashburn-1
    awsRequestChecksumCalculation: when_required
    # -- nodeSelector is derived automatically from global.nodeSelectors.label / global.nodeSelectors.db.
    resources:
      requests:
        cpu: 500m
        memory: 4000Mi
      limits:
        memory: 20000Mi
    postgresql:
      parameters:
        pg_stat_statements.max: "5000"
        pg_stat_statements.track: all
        max_connections: "400"
        shared_buffers: "1024MB"
    monitoring:
      enabled: false
      podMonitor:
        enabled: true

  # -- Backup configuration. Disabled by default; configure provider credentials before enabling.
  backups:
    enabled: true
    provider: s3
    s3:
      region: ""
      bucket: ""
      path: "/"
      accessKey: ""
      secretKey: ""
    destinationPath: ""
    retentionPolicy: "30d"
    endpointURL: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"    
    wal:
      compression: gzip
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 0 * * *"
        backupOwnerReference: self
        method: barmanObjectStore

  poolers: []

vault:
  enabled: false
  serverCaCertificateB64: ""
  serverAddress: https://vault.example.com
  authMount: "k8s-clustername"
  kafkaClientCertDomain: example.com

perfectscale:
  enabled: false
