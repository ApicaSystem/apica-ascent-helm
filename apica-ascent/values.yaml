logiq-flash:
  replicaCount: 2
  replicaCountMl: 1
  replicaCountSync: 1
  service:
    type: NodePort
  image:
    repository: docker.io/logiqai/flash
    tag: v3.19.5
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 100Gi
    ml_size: 20Gi
  metrics:
    serviceMonitor:
      enabled: true
    selector:
      release: prometheus
  resources:
    ingest:
      limits:
        cpu: "1250m"
      requests:
        cpu: "1250m"
        memory: "3500Mi"
    ml:
      limits:
        cpu: "1000m"
      requests:
        cpu: "500m"
    sync:
      requests:
        cpu: "100m"

flash-discovery:
  fullnameOverride: flash-discovery
  image:
    repository: docker.io/logiqai/flash-discovery
    tag: 2.0.3
    pullPolicy: IfNotPresent
  replicaCountDiscovery: 2
  persistence:
    enabled: true
    size: 2Gi

redis:
  enabled: true
  fullnameOverride: redis
  usePassword: false
  cluster:
    slaveCount: 0
  master:
    disableCommands: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis
            topologyKey: "kubernetes.io/hostname"
    persistence:
      enabled: false
  slave:
    disableCommands: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis
            topologyKey: "kubernetes.io/hostname"
    persistence:
      enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    selector:
      release: prometheus
  podSecurityPolicy:
    create: true
    rbac:
      create: true
      role:
        rules:
          - apiGroups:
              - policy
            resources:
              - podsecuritypolicies
            verbs:
              - use
            resourceNames:
              - redis
  securityContext:
    enable: true
    fsGroup: 1001
    runAsUser: 1001
  serviceAccount:
    create: true
    name: redis

postgres:
  enabled: false
  fullnameOverride: postgres
  postgresqlPostgresPassword: postgres
  postgresqlUsername: postgres
  postgresqlDatabase: postgres
  postgresqlPassword: postgres
  postgresqlExtendedConf:
    maxConnections: "400"
    sharedBuffers: "1024MB"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    additionalLabels:
      release: prometheus
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
  securityContext:
    enabled: true
    fsGroup: 1001
    runAsUser: 1001
  serviceAccount:
    enabled: true
    name: postgres

flash-coffee:
  service:
    type: ClusterIP
  coffee:
    replicaCount: 2
    image:
      repository: docker.io/logiqai/flash-brew-coffee
      tag: brew.v3.20.3
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "4Gi"
        cpu: "1000m"
      limits:
        cpu: "1000m"
  coffee_worker:
    replicaCount: 2
    image:
      repository: docker.io/logiqai/flash-brew-coffee
      tag: brew.v3.20.3
      pullPolicy: IfNotPresent
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        cpu: "1000m"

s3gateway:
  s3gateway:
    enabled: false
  mode: distributed
  image:
    repository: minio/minio
    tag: RELEASE.2020-09-17T04-49-20Z
  defaultBucket:
    enabled: true
  fullnameOverride: s3-gateway
  accessKey: logiq_access
  secretKey: logiq_secret
  metrics:
    serviceMonitor:
      enabled: false
  buckets:
    - name: devops-test
      policy: none
      purge: false
  persistence:
    enabled: true
    size: 25Gi
  securityContext:
    enabled: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  serviceAccount:
    create: true
    name: s3-gateway
thanos:
  createObjstoreSecret: true
  receive:
    logLevel: info
    service:
      type: ClusterIP
    enabled: true
  query:
    enabled: true
    dnsDiscovery:
      enabled: true
  bucketweb:
    enabled: true
  compactor:
    enabled: true
  storegateway:
    enabled: true
  ruler:
    enabled: true
    alertmanagers:
      - prometheus-alertmanager
    existingConfigmap: thanos-ruler-configmap
# Gateway API configuration
gateway:
  tls:
    enabled: true
    secretName: ascent-external-cert

# Envoy Gateway Configuration for Oracle Cloud (OKE)
envoyGateway:
  enabled: true

  # GatewayClass configuration
  gatewayClass:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    description: "Envoy Gateway for Apica Ascent"

  # EnvoyProxy configuration
  envoyProxy:
    provider:
      type: Kubernetes
      service:
        type: LoadBalancer
        # OCI Load Balancer annotations
        annotations:
          service.beta.kubernetes.io/oci-load-balancer-health-check-port: "10256"
          service.beta.kubernetes.io/oci-load-balancer-shape: flexible
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "30"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
        externalTrafficPolicy: Cluster

  # Gateway listeners configuration
  listeners:
    http:
      port: 80
      protocol: HTTP
    https:
      port: 443
      protocol: HTTPS
    tcp:
      - name: tcp-9999
        port: 9999
        protocol: TCP
      - name: tcp-8081
        port: 8081
        protocol: TCP
apicaTLSSecret:
  enabled: true
prometheus:
  fullnameOverride: prometheus
  persistence:
    enabled: true
    size: 20Gi
  alertmanager:
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
  prometheus:
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
    thanos:
      create: true
      objectStorageConfig:
        secretName: thanos-objstore-secret
        secretKey: objstore.yml
  operator:
    replicaCount: 1
  kube-state-metrics:
    replicaCount: 1
  # Disable node-exporter via exporters section
  exporters:
    node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: true
  node-exporter:
    enabled: false
    replicaCount: 0

grafana:
  fullnameOverride: grafana

logiqctl:
  image:
    repository: docker.io/logiqai/logiqctl
    tag: 2.0.4
    pullPolicy: IfNotPresent
global:
  domain: null
  kubeDistributor:
    enabled: false
  cloudProvider: aws
  # NodePort Configuration
  nodePort:
    enabled: true # Set to true to enable NodePort services
    ports:
      flash: null # null = Kubernetes auto-assigns (recommended for multi-tenancy)
      flashMl: null # or set to specific port for manual assignment
      thanosReceiveHttp: null # Thanos Receive HTTP port (default: auto-assign)
      thanosReceiveGrpc: null # Thanos Receive gRPC port (default: auto-assign)
      thanosReceiveRemote: null # Thanos Receive remote write port (default: auto-assign)
  createStorageClass: false
  enableMetricsServer: false
  sharedSecretName: logiq-shared-secret
  nodeSelectors:
    enabled: true
    label: apica-node-pool
    ingest: ingest
    infra: base
    other: base
    db: common
    cache: common
    ingest_sync: base
  taints:
    enabled: false
    ingest: flash
    infra: infra
    other: coffee
    db: db
    cache: cache
    ingest_sync: sync
  job:
    ttlSecondsAfterFinished: 100
  toolbox:
    image:
      repository: docker.io/logiqai/toolbox
      tag: 2.0.1
  environment:
    logiq_flash_host: logiq-flash
    logiq_flash_port: 9999
    redis_opts: true
    redis_host: "redis-master"
    redis_port: "6379"
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    s3_url: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
    s3_access: "s3_access"
    s3_secret: "s3_secret"
    AWS_ACCESS_KEY_ID: "s3_access"
    AWS_SECRET_ACCESS_KEY: "s3_secret"
    s3_bucket: "bucket-name"
    s3_region: "region"
    admin_name: "devops@apica.io"
    admin_password: "password"
    admin_org: "flash-org"
    admin_email: "flash-admin@foo.com"
    license: "license/license.jws"
    upload_dashboard: false
    cluster_id: LOGIQ
    awsServiceEndpoint: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
    external_cert_crt: ""
    external_cert_key: ""
    internal_cert_crt: ""
    internal_cert_key: ""
    kafka_args: "-kafka_ca_cert_path=/flash/kafka/ca.crt -kafka_client_key_path=/flash/kafka/tls.key -kafka_client_cert_path=/flash/kafka/tls.crt"
    extraflag: "-hauler-node-affinity=false --tail_longpoll=true -persist=true"
  persistence:
    storageClass: oci-bv
  chart:
    prometheus: true
    postgres: true
    redis: true
    s3gateway: false
    grafana: false
vault:
  enabled: false
  serverCaCertificateB64: ""
  serverAddress: https://vault.example.com
  authMount: "k8s-clustername"
  kafkaClientCertDomain: example.com
