# Source: apica-ascent/templates/envoyproxy.yaml
# EnvoyProxy Configuration
# Configures the Envoy Gateway LoadBalancer service with cloud-specific settings
# This resource is created before the GatewayClass (hook-weight: -10)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: vso-test-envoy-config
  namespace: vso-test
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    helm.sh/chart: apica-ascent-3.0.0
    app.kubernetes.io/name: apica-ascent
    app.kubernetes.io/instance: vso-test
    app.kubernetes.io/version: "v3.10.2"
    app.kubernetes.io/managed-by: Helm
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # Cloud provider annotations (e.g., OCI Load Balancer shape, health check port)
        annotations:
          service.beta.kubernetes.io/oci-load-balancer-health-check-port: "10256"
          service.beta.kubernetes.io/oci-load-balancer-shape: flexible
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "30"
          service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
        # Strategic merge patch to configure service behavior
        # externalTrafficPolicy: Cluster prevents automatic healthCheckNodePort assignment
        # This allows cloud providers to use custom health check ports (e.g., OCI port 10256)
        patch:
          type: StrategicMerge
          value:
            spec:
              externalTrafficPolicy: Cluster
