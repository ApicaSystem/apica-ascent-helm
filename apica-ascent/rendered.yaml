# Source: apica-ascent/charts/flash-coffee/templates/001-coffee-server-sts.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: coffee-server-deployment
  name: coffee-server
spec:
  replicas: 2
  serviceName: coffee
  selector:
    matchLabels:
      app: coffee-server
  template:
    metadata:
      labels:
        app: coffee-server
    spec:
      serviceAccountName: flash-coffee
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: apica-node-pool
                    operator: In
                    values:
                      - base

      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      initContainers:
        - name: check-redis
          image: docker.io/logiqai/toolbox:2.0.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              until redis-cli -h redis-master ping;
              do echo "waiting for redis-master"; sleep 1; done;

        - name: check-postgres
          image: docker.io/logiqai/toolbox:2.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vso-test-flash-coffee
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: vso-test-flash-coffee
                  key: postgres_host
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vso-test-flash-coffee
                  key: database_url
          command:
            - sh
            - -c
            - >
