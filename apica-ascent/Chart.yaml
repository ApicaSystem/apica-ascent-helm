apiVersion: v2
version: 3.1.5
appVersion: v2.16.6
description: Apica Ascent - Cloud-native observability platform
keywords:
  - apica
  - ascent
  - observability
  - logging
  - monitoring
  - tracing
  - metrics
  - gateway-api
  - envoy-gateway
annotations:
  category: Observability
  licenses: Apache-2.0
dependencies:
  - alias: cnpg
    condition: cnpg.enabled
    name: cluster
    repository: https://cloudnative-pg.github.io/charts
    version: 0.6.1
  - name: coffee-server
    version: 1.0.0
    condition: global.chart.coffee-server
  - name: logiq-flash
    version: 1.0.0
    condition: global.chart.logiq-flash
  - name: logiqctl
    version: 1.0.0
    condition: global.chart.logiqctl
  - name: flash-discovery
    version: 1.0.0
    condition: global.chart.flash-discovery
  - alias: postgres
    condition: global.chart.postgres
    name: postgresql
    repository: https://charts.bitnami.com/bitnami
    version: 8.7.3
  - alias: redis
    condition: global.chart.redis
    name: redis
    repository: https://charts.bitnami.com/bitnami
    version: 10.6.5
  - alias: prometheus
    condition: global.chart.prometheus
    name: kube-prometheus
    repository: https://charts.bitnami.com/bitnami
    version: 6.5.3
  - alias: grafana
    condition: global.chart.grafana
    name: grafana
    repository: https://charts.bitnami.com/bitnami
    version: 4.2.4
  - alias: common
    condition: global.chart.grafana
    name: common
    repository: https://charts.bitnami.com/bitnami
    version: 1.1.1
  - alias: thanos
    condition: global.chart.thanos
    name: thanos
    repository: https://charts.bitnami.com/bitnami
    version: 8.2.5
home: https://apica.io
sources:
  - https://github.com/apica-io/apica-ascent-helm
icon: https://www.apica.io/wp-content/uploads/2023/01/apica-logo-white-2022.png
maintainers:
  - email: manchal.sharma@apica.io
    name: manchal
  - email: support@apica.io
    name: support
  - email: kumar.vishnu@apica.io
    name: vishnu
  - email: lokesh.sm@apica.io
    name: lokesh
name: apica-ascent
type: application
kubeVersion: ">=1.24.0-0"
