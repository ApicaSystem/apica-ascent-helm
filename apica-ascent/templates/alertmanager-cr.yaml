{{- if and .Values.global.chart.prometheus .Values.prometheus.alertmanager.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: {{ .Release.Namespace }}-prometheus-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  replicas: {{ .Values.prometheus.alertmanager.replicaCount }}
  # Without fsGroup the pod runs as nobody and cannot write to its volume
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  {{- if .Values.prometheus.alertmanager.persistence.enabled }}
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.prometheus.alertmanager.persistence.size }}
  {{- end }}
{{- end }}
