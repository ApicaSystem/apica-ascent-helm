{{- if .Values.envoyGateway.enabled }}
---
# TCPRoute for port 9999 - logiq-flash (API/Ingest)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-9999
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-9999
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash
          port: 9999
          weight: 1
---
# TCPRoute for port 8081 - logiq-flash-ml (ML/Analytics)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-8081
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-8081
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash-ml
          port: 8081
          weight: 1
