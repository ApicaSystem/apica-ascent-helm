{{- if .Values.envoyGateway.enabled }}
---
# TCPRoute for port 9999 - logiq-flash (API/Ingest)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-9999
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-9999
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash
          port: 9999
          weight: 1
---
# TCPRoute for port 8081 - logiq-flash-ml (ML/Analytics)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-8081
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-8081
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash-ml
          port: 8081
          weight: 1

# ============================================================================
# Gated ingestion routes, one per port from logiq.gatedTcpPorts:
# - Jaeger-compatible trace ingestion (unauthenticated) - opt-in only, via
#   envoyGateway.traceIngestion.enabled, which must stay false unless the
#   gateway is reachable only from a trusted network.
# - Splunk S2S 9996/9997 - on by default, opt out via
#   envoyGateway.s2sIngestion.enabled: false.
# ============================================================================
{{- range (include "logiq.gatedTcpPorts" . | fromYamlArray) }}
---
# TCPRoute for port {{ .port }} - {{ .description | default "trace ingestion" }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logiq.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Release.Name }}-gateway
      sectionName: {{ .name }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .service | default "logiq-flash" }}
          port: {{ .port }}
          weight: 1
{{- end }}
{{- end }}
