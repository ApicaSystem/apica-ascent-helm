{{- if .Values.envoyGateway.enabled }}
---
# TCPRoute for port 9999 - logiq-flash (API/Ingest)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-9999
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-9999
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash
          port: 9999
          weight: 1
---
# TCPRoute for port 8081 - logiq-flash-ml (ML/Analytics)
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Release.Name }}-tcp-8081
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}-gateway
      sectionName: tcp-8081
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: logiq-flash-ml
          port: 8081
          weight: 1

# ============================================================================
# Jaeger-compatible trace ingestion (unauthenticated) - opt-in only.
# Gated by envoyGateway.traceIngestion.enabled, which must stay false unless
# the gateway is reachable only from a trusted network.
# ============================================================================
{{- $trace := .Values.envoyGateway.traceIngestion | default dict }}
{{- /* Accept bool true or the string "true" (CD pipelines often pass strings).
       Anything else - including the string "false", which Go templates would
       otherwise treat as truthy - leaves these ports closed. */}}
{{- $traceEnabled := eq (lower (toString (default false $trace.enabled))) "true" }}
{{- if $traceEnabled }}
{{- range $trace.ports }}
---
# TCPRoute for port {{ .port }} - {{ .description | default "trace ingestion" }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logiq.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Release.Name }}-gateway
      sectionName: {{ .name }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .service | default "logiq-flash" }}
          port: {{ .port }}
          weight: 1
{{- end }}
{{- end }}
{{- end }}
