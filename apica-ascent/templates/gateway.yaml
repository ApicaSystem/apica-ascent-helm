{{- if .Values.envoyGateway.enabled -}}
---
# Gateway API Gateway Resource
# Defines the entry point for all traffic into the Apica Ascent platform
# Uses Envoy Gateway v1.4.5 with Gateway API v1.2.0
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.envoyGateway.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.envoyGateway.gatewayClassName }}
  listeners:
  
  # ============================================================================
  # HTTP/HTTPS Listeners - Web UI and API Access
  # ============================================================================
  
  # HTTP Listener (Port 80)
  # Handles: Web UI, REST APIs, Health checks
  - name: http
    protocol: HTTP
    port: {{ .Values.envoyGateway.gateway.listeners.http.port | default 80 }}
    allowedRoutes:
      namespaces:
        from: Same
  
  # HTTPS Listener (Port 443)
  # Handles: Secure Web UI, REST APIs (when TLS enabled)
  # Only created when TLS is enabled to ensure Gateway API compliance
  {{- if .Values.gateway.tls.enabled }}
  - name: https
    protocol: HTTPS
    port: {{ .Values.envoyGateway.gateway.listeners.https.port | default 443 }}
    tls:
      mode: Terminate
      certificateRefs:
      {{- if and .Values.envoyGateway.gateway.listeners.https.tls .Values.envoyGateway.gateway.listeners.https.tls.certificateRefs }}
      {{- range .Values.envoyGateway.gateway.listeners.https.tls.certificateRefs }}
      - name: {{ .name }}
        kind: {{ .kind | default "Secret" }}
      {{- end }}
      {{- else if .Values.gateway.tls.secretName }}
      - name: {{ .Values.gateway.tls.secretName }}
        kind: Secret
      {{- end }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  
  # ============================================================================
  # TCP Listeners - Data Ingestion and Analytics
  # ============================================================================
  
  # TCP Port 9999 - Primary Ingest Port
  # Handles: OTLP logs/traces/metrics, JSON ingestion, Health checks
  - name: tcp-9999
    protocol: TCP
    port: 9999
    allowedRoutes:
      kinds:
      - kind: TCPRoute
      namespaces:
        from: Same
  
  # TCP Port 8081 - ML/Analytics Port
  # Handles: Machine learning APIs, Advanced analytics
  - name: tcp-8081
    protocol: TCP
    port: 8081
    allowedRoutes:
      kinds:
      - kind: TCPRoute
      namespaces:
        from: Same
{{- end }}