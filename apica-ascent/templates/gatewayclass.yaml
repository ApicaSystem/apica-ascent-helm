{{- if .Values.envoyGateway.enabled }}
---
# Per-Namespace GatewayClass Resource
# Each namespace/release gets its own GatewayClass that references its EnvoyProxy configuration
# This enables per-namespace Load Balancer customization (annotations, health check ports, etc.)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Release.Name }}-gateway-class
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  # Envoy Gateway controller name
  controllerName: {{ .Values.envoyGateway.gatewayClass.controllerName | default "gateway.envoyproxy.io/gatewayclass-controller" }}
  
  # Reference to namespace-scoped EnvoyProxy configuration
  # This is the KEY to making per-namespace LB annotations work
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Release.Name }}-envoy-config
    namespace: {{ .Release.Namespace }}
  
  description: {{ .Values.envoyGateway.gatewayClass.description | default "Envoy Gateway for Apica Ascent" }}
{{- end }}