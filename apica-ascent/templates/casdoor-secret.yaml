apiVersion: v1
kind: Secret
metadata:
  name: casdoor-conf
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
stringData:
  # Host is intentionally sourced from postgres.fullnameOverride (Bitnami service name),
  # not global.environment.postgres_host, so this config stays pointed at Bitnami postgres
  # until the casdoor DB is explicitly migrated to CNPG.
  dataSourceName: {{ printf "user=%s password=%s host=%s port=5432 sslmode=disable dbname=casdoor" .Values.postgres.postgresqlUsername .Values.postgres.postgresqlPassword .Values.postgres.fullnameOverride | quote }}
  casdoor.conf: |
    appname = casdoor
    httpport = 8000
    runmode = dev
    copyrequestbody = true
    driverName = postgres
    dataSourceName = "{{ printf "user=%s password=%s host=%s port=5432 sslmode=disable dbname=casdoor" .Values.postgres.postgresqlUsername .Values.postgres.postgresqlPassword .Values.postgres.fullnameOverride }}"
    dbName = casdoor
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    defaultStorageProvider =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = "127.0.0.1:10808"
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    isUsernameLowered = false
    origin =
    originFrontend =
    staticBaseUrl = "https://cdn.casbin.org"
    isDemoMode = false
    batchSize = 100
    enableErrorMask = false
    enableGzip = true
    ldapServerPort = 389
    radiusServerPort = 1812
    radiusSecret = "secret"
    quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
    initDataFile = "./init_data.json"
    frontendBaseDir = "../casdoor"
    inactiveTimeoutMinutes = 20
    expireInHours = 720
    loginAttempts = 3
