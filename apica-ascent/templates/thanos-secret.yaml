apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.prometheus.prometheus.thanos.objectStorageConfig.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
  labels:
    app: thanos
data:
  objstore.yml: {{ tpl ( .Files.Get "config/thanos-config.tpl" ) . | b64enc }}
