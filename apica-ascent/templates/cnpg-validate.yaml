{{- if .Values.cnpg.enabled }}
{{- if and .Values.cnpg.createSecrets (not .Values.cnpg.superuserSecret.name) }}
{{- fail "cnpg.superuserSecret.name is required when cnpg.createSecrets is enabled." }}
{{- end }}
{{- if and .Values.cnpg.createSecrets (not .Values.cnpg.appUserSecret.name) }}
{{- fail "cnpg.appUserSecret.name is required when cnpg.createSecrets is enabled." }}
{{- end }}
{{- if .Values.cnpg.migration.enabled }}
{{- if not .Values.cnpg.migration.source.host }}
{{- fail "cnpg.migration.source.host is required when cnpg.migration.enabled is true." }}
{{- end }}
{{- if and .Values.cnpg.migration.source.passwordSecret.enabled (not .Values.cnpg.migration.source.passwordSecret.name) }}
{{- fail "cnpg.migration.source.passwordSecret.name is required when cnpg.migration.source.passwordSecret.enabled is true." }}
{{- end }}
{{- if and .Values.cnpg.migration.source.passwordSecret.enabled (not .Values.cnpg.migration.source.passwordSecret.key) }}
{{- fail "cnpg.migration.source.passwordSecret.key is required when cnpg.migration.source.passwordSecret.enabled is true." }}
{{- end }}
{{- if and (not .Values.cnpg.migration.source.passwordSecret.enabled) (not .Values.cnpg.migration.source.password) }}
{{- fail "cnpg.migration.source.password is required when cnpg.migration.source.passwordSecret.enabled is false." }}
{{- end }}
{{- end }}
{{- end }}
