{{- if .Values.envoyGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Release.Name }}-gateway
    sectionName: {{ if .Values.gateway.tls.enabled }}https{{ else }}http{{ end }}

  {{- if .Values.global.domain }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  {{- end }}

  rules:
  # Health and readiness probes used by Kubernetes and load balancers.
  # Port 8080 is the liveness-port exposed by logiq-flash service
  - matches:
    - path:
        type: PathPrefix
        value: /live
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 8080
        weight: 1

  - matches:
    - path:
        type: PathPrefix
        value: /ready
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 8080
        weight: 1

  # OpenTelemetry ingestion endpoints.
  - matches:
    - path:
        type: PathPrefix
        value: /v1/logs
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  - matches:
    - path:
        type: PathPrefix
        value: /v1/traces
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  - matches:
    - path:
        type: PathPrefix
        value: /v1/metrics
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  # Distributed tracing UI (Jaeger-style UI exposed by ML service).
  - matches:
    - path:
        type: PathPrefix
        value: /dtracing
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 16686
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 16686
        weight: 1
    {{- end }}

  # Prometheus remote-write receive endpoint (must come before /v1 route)
  - matches:
    - path:
        type: PathPrefix
        value: /v1/receive/prometheus
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  # Thanos remote-write receive endpoint (optional, enabled per deployment).
  {{- if .Values.global.chart.thanos }}
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/receive
    backendRefs:
      - group: ''
        kind: Service
        name: {{ .Release.Namespace }}-thanos-receive
        port: 19291
        weight: 1
  {{- end }}

  # API v2 endpoints.
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 9999
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 9999
        weight: 1
    {{- end }}

  # JSON ingestion endpoints (must come before general /v1 route).
  - matches:
    - path:
        type: PathPrefix
        value: /v1/json_batch
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  - matches:
    - path:
        type: PathPrefix
        value: /v1/json
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  # API v1 endpoints (general routing - must come AFTER all specific /v1/* routes).
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 9999
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 9999
        weight: 1
    {{- end }}

  # Jaeger-compatible trace ingestion.
  - matches:
    - path:
        type: PathPrefix
        value: /api/traces
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 14268
        weight: 1

  # General API endpoints (organization, etc.)
  # This must come after specific /api routes (/api/v1/receive, /api/traces)
  # but before the catch-all / route
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1

  # Additional routes injected via values.yaml (cloud or environment specific).
  {{- if .Values.gateway.extraRoutes }}
  {{- range .Values.gateway.extraRoutes }}
  - matches:
    - path:
        type: {{ .pathType | default "PathPrefix" }}
        value: {{ .path }}
    backendRefs:
      - group: ''
        kind: Service
        name: {{ .backend.service.name }}
        port: {{ .backend.service.port.number }}
  {{- end }}
  {{- end }}

  # Static assets are cacheable and immutable; must be evaluated before "/" route.
  - matches:
    - path:
        type: PathPrefix
        value: /assets/
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Cache-Control
          value: "public, max-age=31536000, immutable"
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1

  # IMPORTANT: This rule must always be last.
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Cache-Control
          value: "no-store"
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1
{{- end }}

