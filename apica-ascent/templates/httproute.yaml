{{- if .Values.envoyGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Release.Name }}-gateway
    sectionName: {{ if .Values.gateway.tls.enabled }}https{{ else }}http{{ end }}
  {{- if .Values.global.domain }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  {{- end }}
  rules:
  # Health check endpoints
  - matches:
    - path:
        type: PathPrefix
        value: /live
    backendRefs:
    - name: logiq-flash
      port: 9999
  - matches:
    - path:
        type: PathPrefix
        value: /ready
    backendRefs:
    - name: logiq-flash
      port: 9999
  # OTLP endpoints
  - matches:
    - path:
        type: PathPrefix
        value: /v1/logs
    backendRefs:
    - name: logiq-flash
      port: 9999
  - matches:
    - path:
        type: PathPrefix
        value: /v1/traces
    backendRefs:
    - name: logiq-flash
      port: 9999
  - matches:
    - path:
        type: PathPrefix
        value: /v1/metrics
    backendRefs:
    - name: logiq-flash
      port: 9999
  # Distributed tracing UI
  - matches:
    - path:
        type: PathPrefix
        value: /dtracing
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
    - name: logiq-flash-ml-np
      port: 16686
    {{- else }}
    - name: logiq-flash-ml
      port: 16686
    {{- end }}
  # Thanos receive endpoint
  {{- if .Values.global.chart.thanos }}
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/receive
    backendRefs:
    - name: {{ .Release.Namespace }}-thanos-receive
      port: 19291
  {{- end }}
  # API v2 endpoints
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
    - name: logiq-flash-ml-np
      port: 9999
    {{- else }}
    - name: logiq-flash-ml
      port: 9999
    {{- end }}
  # API v1 endpoints (general)
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
    - name: logiq-flash-ml-np
      port: 9999
    {{- else }}
    - name: logiq-flash-ml
      port: 9999
    {{- end }}
  # JSON batch ingestion
  - matches:
    - path:
        type: PathPrefix
        value: /v1/json_batch
    backendRefs:
    - name: logiq-flash
      port: 9999
  # JSON ingestion
  - matches:
    - path:
        type: PathPrefix
        value: /v1/json
    backendRefs:
    - name: logiq-flash
      port: 9999
  # Tenant API
  - matches:
    - path:
        type: PathPrefix
        value: /v1/tenant
    backendRefs:
    - name: logiq-flash
      port: 9999
  # Jaeger traces API
  - matches:
    - path:
        type: PathPrefix
        value: /api/traces
    backendRefs:
    - name: logiq-flash
      port: 14268
  {{- if .Values.gateway.extraRoutes }}
  # Extra routes from values (e.g., OKE specific routes)
  {{- range .Values.gateway.extraRoutes }}
  - matches:
    - path:
        type: {{ .pathType | default "PathPrefix" }}
        value: {{ .path }}
    backendRefs:
    - name: {{ .backend.service.name }}
      port: {{ .backend.service.port.number }}
  {{- end }}
  {{- end }}
  # Default route - Coffee UI (must be last)
  # Includes static asset caching for js, css, images
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Cache-Control
          value: "public, max-age=2592000"  # 30 days for static assets
    backendRefs:
    - name: coffee
      port: 80
{{- end }}