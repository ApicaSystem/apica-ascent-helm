{{- if .Values.envoyGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Release.Name }}-gateway
    sectionName: {{ if .Values.gateway.tls.enabled }}https{{ else }}http{{ end }}

  {{- if .Values.global.domain }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  {{- end }}

  rules:
  # Distributed tracing UI (Jaeger-style UI exposed by ML service).
  - matches:
    - path:
        type: PathPrefix
        value: /dtracing
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 16686
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 16686
        weight: 1
    {{- end }}

  # Thanos remote-write receive endpoint (optional, enabled per deployment).
  {{- if .Values.global.chart.thanos }}
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/receive
    backendRefs:
      - group: ''
        kind: Service
        name: {{ .Release.Namespace }}-thanos-receive
        port: 19291
        weight: 1
  {{- end }}

  # API v2 endpoints.
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 9999
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 9999
        weight: 1
    {{- end }}

  # /v1/json_batch and /v1/json are NOT defined here — they live only in
  # envoy-httproute-flash.yaml. Both routes attach to the same Gateway listener, and Gateway
  # API does not let two HTTPRoutes both claim the same path on one listener: the duplicate
  # previously here silently won over envoy-httproute-flash.yaml's copy (confirmed empirically
  # 2026-10-07 — real traffic landed on this route's cluster, not the dedicated one), which
  # routed real traffic to the same backend but broke KEDA's ingest metric: it queries only the
  # dedicated route's envoy_cluster_name, so it read 0 while ingestion was actually ~6 GB/hr.
  #
  # /v1 catch-all for ML; specific flash /v1/* rules in envoy-httproute-flash.yaml take
  # priority since they are not duplicated here. API v1 endpoints (general routing) — must
  # come AFTER all specific /v1/* routes.
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    {{- if .Values.global.nodePort.enabled }}
      - group: ''
        kind: Service
        name: logiq-flash-ml-np
        port: 9999
        weight: 1
    {{- else }}
      - group: ''
        kind: Service
        name: logiq-flash-ml
        port: 9999
        weight: 1
    {{- end }}

  # Jaeger-compatible trace ingestion.
  - matches:
    - path:
        type: PathPrefix
        value: /api/traces
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 14268
        weight: 1

  # Datadog agent ingest
  - matches:
    - path:
        type: PathPrefix
        value: /api/v2/logs
    backendRefs:
      - group: ''
        kind: Service
        name: logiq-flash
        port: 9999
        weight: 1

  # General API endpoints (organization, etc.)
  # This must come after specific /api routes (/api/v1/receive, /api/traces)
  # but before the catch-all / route
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1
  # Additional routes injected via values.yaml (cloud or environment specific).
  {{- if .Values.gateway.extraRoutes }}
  {{- range .Values.gateway.extraRoutes }}
  - matches:
    - path:
        type: {{ .pathType | default "PathPrefix" }}
        value: {{ .path }}
    backendRefs:
      - group: ''
        kind: Service
        name: {{ .backend.service.name }}
        port: {{ .backend.service.port.number }}
  {{- end }}
  {{- end }}

  # General API endpoints (organization, etc.)
  # Must come after specific /api routes (/api/v1/receive, /api/traces).
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1

  # Static assets are cacheable and immutable; must be evaluated before "/" route.
  - matches:
    - path:
        type: PathPrefix
        value: /assets/
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Cache-Control
          value: "public, max-age=31536000, immutable"
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1

  # IMPORTANT: This rule must always be last.
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Cache-Control
          value: "no-store"
    backendRefs:
      - group: ''
        kind: Service
        name: coffee
        port: 80
        weight: 1
{{- end }}
