{{- if .Values.envoyGateway.enabled }}
---
# EnvoyProxy Configuration
# Configures the Envoy Gateway LoadBalancer service with cloud-specific settings
# This resource is created before the GatewayClass (hook-weight: -10)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Release.Name }}-envoy-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
spec:
  provider:
    type: {{ .Values.envoyGateway.envoyProxy.provider.type | default "Kubernetes" }}
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.envoyGateway.envoyProxy.provider.deployment.replicaCount | default 2 }}
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: ScheduleAnyway
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: envoy
                          app.kubernetes.io/component: proxy
                          gateway.envoyproxy.io/owning-gateway-name: {{ .Release.Name }}-gateway
                  affinity:
                    podAntiAffinity:
                      preferredDuringSchedulingIgnoredDuringExecution:
                        - weight: 100
                          podAffinityTerm:
                            topologyKey: kubernetes.io/hostname
                            labelSelector:
                              matchLabels:
                                app.kubernetes.io/name: envoy
                                app.kubernetes.io/component: proxy
                                gateway.envoyproxy.io/owning-gateway-name: {{ .Release.Name }}-gateway

      envoyService:
        type: {{ .Values.envoyGateway.envoyProxy.provider.service.type | default "LoadBalancer" }}
        {{- if .Values.envoyGateway.envoyProxy.provider.service.annotations }}
        # Cloud provider annotations (e.g., OCI Load Balancer shape, health check port)
        annotations:
          {{- toYaml .Values.envoyGateway.envoyProxy.provider.service.annotations | nindent 10 }}
        {{- end }}
        # Strategic merge patch to configure service behavior
        # externalTrafficPolicy: Cluster prevents automatic healthCheckNodePort assignment
        # This allows cloud providers to use custom health check ports (e.g., OCI port 10256)
        patch:
          type: StrategicMerge
          value:
            spec:
              externalTrafficPolicy: {{ .Values.envoyGateway.envoyProxy.provider.service.externalTrafficPolicy | default "Cluster" }}
{{- end }}
