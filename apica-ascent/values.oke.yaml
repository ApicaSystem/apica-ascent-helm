# Gateway API configuration
gateway:
  tls:
    enabled: true
    # secretName: Set via --set gateway.tls.secretName=your-tls-secret
  # extraRoutes removed - all routes are now in the base HTTPRoute template
  # The base template already includes /live, /ready, /v1/logs, /v1/traces, /v1/metrics

# Envoy Gateway Configuration for Oracle Cloud (OKE)
envoyGateway:
  enabled: true
  # Create GatewayClass resource (set to true to auto-create)
  createGatewayClass: true
  gatewayClassName: envoy
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  gatewayClassDescription: "Envoy Gateway for Apica Ascent"
  gateway:
    name: apica-gateway
    replicas: 2
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/oci-load-balancer-shape: flexible
        service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "20"
        service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
        # Health check on port 10256
        service.beta.kubernetes.io/oci-load-balancer-health-check-port: "10256"
    listeners:
      http:
        port: 80
        protocol: HTTP
      https:
        port: 443
        protocol: HTTPS
        # tls.certificateRefs: Set via --set if needed, otherwise uses gateway.tls.secretName
apicaTLSSecret:
  enabled: true
prometheus: 
  fullnameOverride: prometheus
  persistence:
    enabled: true
    size: 20Gi
  alertmanager:
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
  prometheus:
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
  operator:
    replicaCount: 1
  kube-state-metrics:
    replicaCount: 1
  node-exporter:
    replicaCount: 1

grafana:
  fullnameOverride: grafana

logiqctl:
  image:
    repository: logiqai/logiqctl
    tag: 2.0.4
    pullPolicy: IfNotPresent

global:
  domain: null
  kubeDistributor:
         enabled: false
  cloudProvider: aws
  enableAwsAlb:
    enabled: true
    albType: "internet-facing"
  createStorageClass: false
  enableMetricsServer: false
  sharedSecretName: logiq-shared-secret
  nodeSelectors:
    enabled: false
    ingest: injest
    infra: base
    other: base
    db: common
    cache: common
    ingest_sync: sync
  taints:
    enabled: false
    ingest: flash
    infra: infra
    other: coffee
    db: db
    cache: cache
    ingest_sync: sync
  job:
    ttlSecondsAfterFinished: 100
  toolbox:
    image:
      repository: logiqai/toolbox
      tag: 2.0.1
  environment:
    logiq_flash_host: logiq-flash
    logiq_flash_port: 9999
    redis_opts: true
    redis_host: "redis-master"
    redis_port: "6379"
    postgres_host: "postgres"
    postgres_port: "5432"
    postgres_user: "postgres"
    postgres_password: "postgres"
    postgres_db: "postgres"
    postgres_coffee_db: "coffee"
    s3_url: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
    s3_access: "s3_access"
    s3_secret: "s3_secret"
    AWS_ACCESS_KEY_ID: "s3_access"
    AWS_SECRET_ACCESS_KEY: "s3_secret"
    s3_bucket: "bucket-name"
    s3_region: "region"
    admin_name: "devops@apica.io"
    admin_password: "password"
    admin_org: "flash-org"
    admin_email: "flash-admin@foo.com"
    license: "license/license.jws"
    upload_dashboard: true
    cluster_id: LOGIQ
    awsServiceEndpoint: "https://<bucket-namespace>.compat.objectstorage.<region>.oraclecloud.com"
  persistence:
    storageClass: oci-bv
  chart:
    prometheus: true
    postgres: true
    redis: true
    s3gateway: false
    grafana: false
